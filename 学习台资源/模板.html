<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知行 · AI 学习台</title>
<style>
:root{--ink:#19352f;--muted:#667771;--green:#226a53;--pale:#e7eee6;--paper:#faf9f5;--line:#dce3d9;--gold:#bf6c3c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--green);text-underline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #bd783f;outline-offset:3px}.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.sidebar{padding:35px 22px;background:#edf0e8;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-family:Georgia,"Songti SC",serif;font-size:28px;letter-spacing:3px;font-weight:700}.brand small{display:block;font:11px sans-serif;letter-spacing:2px;margin-top:10px;color:var(--muted)}.nav{display:grid;gap:8px;margin:38px 0}.nav button{background:transparent;text-align:left;border:0;padding:13px 16px;border-radius:9px;color:var(--muted)}.nav button.active{background:var(--ink);color:white}.nav button span{margin-right:10px}.side-note{font-size:12px;line-height:1.9;color:var(--muted);margin-top:auto}.side-note strong{display:block;color:var(--ink)}main{max-width:1250px;width:100%;padding:32px 48px 70px;margin:auto}.topbar{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:600}.hero{padding:36px 0 26px}h1{font-size:clamp(28px,3vw,42px);font-family:Georgia,"Songti SC",serif;line-height:1.4;margin:12px 0}p{line-height:1.85}.hero p{color:var(--muted);max-width:720px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 28px}.stat{padding:19px 22px;border:1px solid var(--line);background:white;border-radius:12px}.stat strong{font-size:27px;display:block;font-family:Georgia,serif}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:8px}.section-label{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:30px 0 16px}.section-label h2{font-size:20px;margin:0}.section-label small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:26px}.daily-head{display:grid;grid-template-columns:1fr auto;gap:20px}.daily-head h2{font-size:25px;line-height:1.6;margin:10px 0}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{border-radius:20px;background:var(--pale);padding:5px 10px;font-size:11px;color:var(--green)}.pill{font-size:12px;color:var(--gold);white-space:nowrap}.button{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 16px;display:inline-block;text-decoration:none;font-size:13px}.button.primary{background:var(--green);color:white;border-color:var(--green)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.flow-panel{background:#f0f4ec;border:1px solid #dbe5d5;padding:26px;border-radius:14px;margin:24px 0}.flow-panel h3{margin:0 0 8px;font-size:21px}.flow-panel>p{color:var(--muted);font-size:13px;margin:6px 0 20px}.flow{display:flex;gap:20px;margin:25px 0}.step{position:relative;flex:1;padding:14px 10px;border:1px solid #c7d7c4;border-radius:10px;background:white;text-align:left;color:var(--ink);min-width:0}.step:not(:last-child):after{content:'→';position:absolute;right:-19px;top:30px;color:#728c72}.step.active{background:var(--green);color:white;border-color:var(--green)}.step b{display:block;font-size:13px;line-height:1.5;margin:8px 0}.step small{font-size:10px;opacity:.8}.step .num{font:13px Georgia}.explanation{background:white;border-radius:10px;padding:18px 22px;min-height:145px}.explanation p{font-size:14px;margin:8px 0}.explanation .failure{color:#8b5637;font-size:12px}.flow-footer{font-size:12px;color:var(--muted);line-height:1.8;margin-top:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:30px 0 20px}.tabs button{padding:12px 18px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted)}.tabs button.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}.article{font-size:15px;line-height:1.95;max-width:860px;overflow-wrap:anywhere}.article h1{font-size:28px}.article h2{font:600 23px/1.7 -apple-system,"PingFang SC",sans-serif;margin-top:35px}.article h3{font-size:18px;margin-top:28px}.article p,.article li{color:#354a42}.article table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:13px;margin:20px 0}.article th,.article td{border:1px solid var(--line);padding:12px;text-align:left;min-width:110px}.article th{background:#eef2e9}.article pre{background:#eef2e9;padding:20px;overflow:auto;border-radius:8px;font-size:13px;line-height:1.7}.article blockquote{border-left:3px solid var(--green);margin:20px 0;padding-left:18px}.article code{font-family:ui-monospace,monospace}.article>h1:first-child{margin-top:0}.empty{text-align:center;padding:45px;color:var(--muted)}.toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}.search{padding:12px 16px;border:1px solid var(--line);background:white;border-radius:9px;width:min(100%,410px);color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filters button{padding:7px 12px;font-size:12px;border:1px solid var(--line);border-radius:20px;background:white;color:var(--muted)}.filters button.active{background:var(--green);color:white}.archive-list{display:grid;gap:14px}.archive-row{text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:22px;color:var(--ink);width:100%}.archive-row:hover{border-color:var(--green)}.archive-row time{font-size:12px;color:var(--muted)}.archive-row h3{font-size:18px;line-height:1.6;margin:9px 0}.archive-row p{color:var(--muted);font-size:13px;margin:8px 0}.roadmap{display:grid;gap:12px;counter-reset:route}.route{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:19px;background:white;border:1px solid var(--line);border-radius:10px}.route:before{counter-increment:route;content:counter(route,decimal-leading-zero);font:22px Georgia;color:#91a18e}.route strong{font-size:15px}.route p{font-size:12px;color:var(--muted);margin:4px 0}.route small{font-size:11px;color:var(--green)}.notice{font-size:12px;color:var(--muted);line-height:1.85;margin:22px 0}.concept-list{display:grid;gap:14px}.concept-list summary{font-size:17px;cursor:pointer}.concept-list details[open] summary{margin-bottom:25px}.bottom{border-top:1px solid var(--line);padding-top:20px;margin-top:38px;font-size:11px;color:var(--muted);line-height:1.8}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(min-width:1400px){main{padding-left:65px;padding-right:65px}}@media(max-width:1000px){.shell{grid-template-columns:200px 1fr}.sidebar{padding:28px 15px}main{padding:25px}.flow{gap:12px;flex-wrap:wrap}.step{flex:1 1 120px}.step:not(:last-child):after{display:none}}@media(max-width:680px){.shell{display:block}.sidebar{position:static;height:auto;padding:20px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:23px}.brand small{display:inline;font-size:9px;margin-left:10px}.nav{display:flex;margin:18px 0 0;gap:4px;overflow:auto}.nav button{padding:10px;white-space:nowrap;font-size:12px}.nav button span{display:none}.side-note{display:none}main{padding:22px 17px 40px}.topbar{font-size:10px}.topbar span:last-child{max-width:170px;text-align:right}.hero{padding-top:24px}.stats{gap:8px}.stat{padding:15px 12px}.stat strong{font-size:23px}.stat span{font-size:10px}.card,.flow-panel{padding:19px}.daily-head{display:block}.daily-head h2{font-size:22px}.pill{display:block;margin-bottom:12px}.flow{gap:8px}.step{flex:1 1 42%}.route{grid-template-columns:28px 1fr}.route small{grid-column:2}.article{font-size:14px}.article h1{font-size:24px}.section-label{align-items:flex-start}.section-label small{font-size:10px}}
@media(prefers-reduced-motion:no-preference){button,a{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">知行<span style="color:#8d9c86"> /</span><small>AI LEARNING JOURNAL</small></div><nav class="nav" aria-label="主导航"><button data-view="daily" class="active"><span>◉</span>每日学习</button><button data-view="archive"><span>▤</span>长期归档</button><button data-view="concepts"><span>◇</span>概念笔记</button><button data-view="progress"><span>↗</span>学习路线</button></nav><div class="side-note"><strong>每天一点，逐渐看懂。</strong>约 15 分钟 · 最新进展 + 系统学习<br>每天北京时间 07:30 开始生成<br><br>Markdown 是长期资料<br>这里是可视化阅读入口</div></aside><main><div class="topbar"><span>个人 AI 知识库</span><span id="updated"></span></div><div id="app"></div><footer class="bottom">本地阅读 · 不依赖外部网络加载页面资源 · 新日报生成后刷新此页<br>阅读标记只保存在当前浏览器，不代表理解程度，也不会自动成为聊天反馈。</footer></main></div>
<script>
const DATA = /*__KNOWLEDGE_DATA__*/;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='daily',selected=DATA.entries[0]?.date,tab='all',query='',filter='全部',step=0;
const storageKey='ai-learning-read-v1';let read=[];try{read=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(read))read=[]}catch{}
const tags=d=>d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
const nav=()=>document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});
function setView(v){view=v;nav();render();window.scrollTo(0,0)}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
document.getElementById('updated').textContent='最近整理 · '+DATA.updated;
function hero(k,t,d){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>`}
function render(){
 if(view==='daily')renderDaily();
 if(view==='archive')renderArchive();
 if(view==='concepts')app.innerHTML=hero('KNOWLEDGE NOTES','让概念慢慢连成网。','从日报提炼可复用的解释；回看时，不必重新翻完整篇文章。')+`<div class="concept-list">${DATA.concepts.map(c=>`<details class="card" open><summary>${esc(c.title)}</summary><div class="article">${c.html}</div><a class="button" href="${encodeURI(c.path)}">打开 Markdown 原文 ↗</a></details>`).join('')||'<div class="empty">概念笔记将随学习逐步积累。</div>'}</div>`;
 if(view==='progress')renderProgress();
 fixLinks();
}
function renderDaily(){const d=DATA.entries.find(d=>d.date===selected)||DATA.entries[0];if(!d){app.innerHTML=hero('DAILY','第一期正在路上。','生成日报后，这里会出现完整内容。');return}
 app.innerHTML=hero('DAILY / '+esc(d.date),'今天，理解一个新问题。','从新进展出发，沿着机制与证据，逐步建立自己的理解。')+`<div class="stats"><div class="stat"><strong>${DATA.entries.length.toString().padStart(2,'0')}</strong><span>已归档日报</span></div><div class="stat"><strong>${DATA.concepts.length.toString().padStart(2,'0')}</strong><span>概念笔记</span></div><div class="stat"><strong>15 min</strong><span>每日阅读预算</span></div></div><section class="card"><div class="daily-head"><div><div class="eyebrow">${d.date===DATA.entries[0].date?'最新一期':'历史回看'} · ${esc(d.date)}</div><h2>${esc(d.title.replace(/^AI 日报 \d+｜/,''))}</h2><div class="tags">${tags(d)}</div></div><span class="pill">◌ 从基础逐步深入</span></div><p style="color:var(--muted);font-size:14px">${esc(d.visual?.summary||'最新进展与系统学习，结合来源和可选理解题。')}</p><div class="actions"><a class="button primary" href="#reading">开始阅读 ↓</a><button class="button" id="read-toggle">${read.includes(d.date)?'✓ 已读 · 点击取消':'标记已读'}</button><a class="button" href="${encodeURI(d.path)}" download>下载 Markdown</a><button class="button" id="history">切换日期</button></div><div id="read-status" class="sr" role="status" aria-live="polite"></div></section>${d.visual?flowMarkup(d.visual):''}<section id="reading"><div class="tabs" role="tablist" aria-label="日报内容"><button role="tab" data-tab="all">完整日报</button><button role="tab" data-tab="news">最新进展</button><button role="tab" data-tab="lesson">系统学习</button><button role="tab" data-tab="question">理解题</button></div><div class="article card" id="article" role="tabpanel"></div></section>`;
 document.getElementById('history').onclick=()=>setView('archive');
 document.getElementById('read-toggle').onclick=()=>{read=read.includes(d.date)?read.filter(x=>x!==d.date):[...read,d.date];let saved=true;try{localStorage.setItem(storageKey,JSON.stringify(read))}catch{saved=false}render();document.getElementById('read-status').textContent=saved?'阅读标记已更新。':'浏览器不允许保存；此标记仅在当前页面有效。'};
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);updateFlow(d.visual)});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;updateArticle(d);fixLinks()});
 updateArticle(d);if(d.visual)updateFlow(d.visual);
}
function flowMarkup(v){return `<section class="flow-panel" aria-label="互动流程图"><div class="eyebrow">LEARN VISUALLY / 互动图解</div><h3>${esc(v.title)}</h3><p>${esc(v.intro)}</p><div class="flow">${v.steps.map((s,i)=>`<button class="step" data-step="${i}" aria-controls="explanation"><span class="num">0${i+1}</span><b>${esc(s.label)}</b><small>${esc(s.role)}</small></button>`).join('')}</div>${v.feedback?`<div style="text-align:center;margin:-10px 0 18px"><button class="button" data-step="${v.feedback.to-1}" style="border-style:dashed;color:var(--green)">步骤 ${v.feedback.from} ↶ 步骤 ${v.feedback.to} · ${esc(v.feedback.label)}</button></div>`:''}<div class="explanation" id="explanation" aria-live="polite"></div><div class="flow-footer">${esc(v.footer)}</div></section>`}
function updateFlow(v){if(!v.steps.length)return;step=Math.min(step,v.steps.length-1);document.querySelectorAll('[data-step]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.step)===step);b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step))});const s=v.steps[step];document.getElementById('explanation').innerHTML=`<strong>${esc(s.label)} · ${esc(s.role)}</strong><p>${esc(s.detail)}</p><p class="failure">留意：${esc(s.failure)}</p>`}
function updateArticle(d){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))});const container=document.getElementById('article');if(tab==='all'){container.innerHTML=d.html;return}const dom=new DOMParser().parseFromString(d.html,'text/html');const heads=[...dom.body.children];const pattern={news:/^一、|最新进展/,lesson:/^二、|系统学习/,question:/^三、|理解题/}[tab];let started=false,parts=[];for(const n of heads){if(n.tagName==='H2'){if(started)break;if(pattern.test(n.textContent))started=true}if(started)parts.push(n.outerHTML)}container.innerHTML=parts.join('')||'<p>本期未单独划分该栏目，请阅读完整日报。</p>'}
function renderArchive(){const allTags=[...new Set(DATA.entries.flatMap(d=>d.tags))];app.innerHTML=hero('ARCHIVE','把每天的发现，留成长期线索。','按日期回看，或按主题和关键词找到值得再读的内容。')+`<div class="toolbar"><label><span class="sr">搜索日报</span><input class="search" id="search" placeholder="搜索标题、正文或主题…" value="${esc(query)}"></label></div><div class="filters">${['全部',...allTags].map(t=>`<button data-filter="${esc(t)}" class="${filter===t?'active':''}" aria-pressed="${filter===t}">${esc(t)}</button>`).join('')}</div><div class="notice" id="result-count" role="status"></div><div class="archive-list" id="archive-list"></div>`;
 document.getElementById('search').oninput=e=>{query=e.target.value;renderResults()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderArchive()});renderResults()}
function renderResults(){const entries=DATA.entries.filter(d=>(filter==='全部'||d.tags.includes(filter))&&(d.title+' '+d.text).toLowerCase().includes(query.toLowerCase()));document.getElementById('result-count').textContent=`找到 ${entries.length} 期日报 · 日期从新到旧`;document.getElementById('archive-list').innerHTML=entries.map(d=>`<button class="archive-row" data-date="${d.date}"><time>${d.date}</time><h3>${esc(d.title)}</h3><p>${esc(d.visual?.summary||'点击阅读完整日报')}</p><div class="tags">${tags(d)}${read.includes(d.date)?'<span class="tag">已读</span>':''}</div></button>`).join('')||'<div class="empty">暂时没有匹配内容。试试其他关键词或主题。</div>';document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;tab='all';step=0;setView('daily')})}
function renderProgress(){app.innerHTML=hero('LEARNING PATH','从看懂术语，到理解机制。','路线可以调整；阅读天数、阅读标记和已介绍概念，都不等于已经掌握。')+`<div class="roadmap">${DATA.roadmap.map(({title:t,description:d,status:s})=>`<div class="route"><div><strong>${esc(t)}</strong><p>${esc(d)}</p></div><small>${esc(s)}</small></div>`).join('')}</div><p class="notice">上方是起始路线。下面的学习记录是每日更新依据；具体进度以记录和你在聊天中的反馈为准。</p><details class="card" open><summary>学习记录与下一步</summary><div class="article">${DATA.progress}</div></details>`}
function fixLinks(){app.querySelectorAll('.article a').forEach(a=>{const raw=a.getAttribute('href')||'';if(/^https?:/i.test(raw)){a.target='_blank';a.rel='noopener noreferrer'}else if(/^(javascript|data|vbscript):/i.test(raw)){a.removeAttribute('href')}else if(!raw.startsWith('#')){const decoded=decodeURI(raw);const match=decoded.match(/(?:^|\/)日报\/(\d{4}-\d{2}-\d{2})\.md$/);if(match&&DATA.entries.some(d=>d.date===match[1])){a.onclick=e=>{e.preventDefault();selected=match[1];tab='all';setView('daily')}}else if(decoded.includes('概念/')){a.onclick=e=>{e.preventDefault();setView('concepts')}}else if(raw.startsWith('../')){a.setAttribute('href',raw.replace(/^\.\.\//,''))}}})}
render();
</script>
</body></html>
