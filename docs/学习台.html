<script>
const DATA = {"entries":[{"date":"2026-10-21","title":"AI 日报 004｜摘要留住了结论，却丢掉了条件","tags":["AI","Agent","Harness","上下文","记忆","摘要","可靠性"],"html":"\u003ch1>AI 日报 004｜摘要留住了结论，却丢掉了条件\u003c/h1>\n\u003cp>日期：2026 年 10 月 21 日（北京时间）\u003cbr>阅读预算：进展与分析约 7 分钟；系统学习、点击图解与思考约 8 分钟。\u003c/p>\n\u003cp>你已经能沿“获取→传入→使用”排查信息问题。今天不重讲这三个词，而是检查一个容易漏掉的地方：工具确实读到了原文，但后续只传入了一个改变原意的摘要。\u003c/p>\n\u003ch2>一、最新进展：关键规则怎样穿过上下文压缩？\u003c/h2>\n\u003ch3>本期检索范围与证据\u003c/h3>\n\u003cp>本次过去 24 小时的检索未选出适合展开、且证据充分的重要更新，因此扩大到最近 7 天。本期只精选一项与当前学习直接相关的发布。下面的产品机制来自维护者说明；我核对了原始页面，但没有安装或独立复现产品，不把官方演示当成普遍效果证明。\u003c/p>\n\u003ch3>Octomind 0.58.5：会话规则单独保留\u003c/h3>\n\u003cp>\u003cstrong>官方文章日期：2026-10-17。\u003c/strong> 这款 Agent 运行工具尝试把用户设定的会话规则保留在有损摘要之外，每轮重新带入；同一会话重启可继续使用，新的会话不自动继承。撤销规则需要明确表达，冲突请求本身不算撤销。官方报告了四轮重启测试，但该演示没有现场触发上下文压缩。规则捕获依赖模型分类，可能漏记；同时最多保留 8 条，新增第 9 条会移除最旧的一条。官方称另有测试覆盖压缩后的保留。\u003ca href=\"https://octomind.run/blog/octomind-0-58-5-release\">官方发布说明\u003c/a>\u003c/p>\n\u003ch3>这项设计触及了什么问题？\u003c/h3>\n\u003cp>下面是独立教学例子，不代表产品的真实内部流程。\u003c/p>\n\u003cp>假设你让助理整理相册，开始时明确说：“只整理副本，原始照片不能删。”后来发生了很多轮对话：挑选照片、比较尺寸、生成分类、讨论目录。为了继续工作，系统把旧对话压成一句：“用户希望清理相册，减少重复文件。”\u003c/p>\n\u003cp>这句话保留了目标，却丢掉了行动边界。之后即使模型很认真地照摘要办事，也可能删除原始照片。问题不只在最后一步“有没有遵守指令”，还在更早的“哪些指令被传了下来”。\u003c/p>\n\u003cp>从这个例子推导，值得分别记录的是：要达到什么目的、哪些动作有约束、约束在什么范围内有效、谁可以修改它。任务进展摘要与持续生效的约束承担不同职责，不宜让一句笼统总结代替两者。\u003c/p>\n\u003ch3>与普通摘要相比，改变的是哪一层？\u003c/h3>\n\u003cp>普通摘要主要回答：“之前谈了什么，事情做到哪了？”单独维护约束则增加一个问题：“接下来行动时，哪些条件仍须检查？”\u003c/p>\n\u003cp>这是运行流程如何组织状态的问题，属于我们讨论的 Harness 职责之一。不是把模型训练得更聪明，也不是仅把最终回答润色一下。它会改变下一轮模型拿到的输入，以及系统据什么判断行动是否合适。\u003c/p>\n\u003cp>但不能据此推断“把所有话都放进规则区就安全了”。临时要求可能只针对一次任务；旧约束可能已经撤销；两条规则可能冲突。记录越多，还越需要管理适用范围和更新。\u003cstrong>留下错误或过期的规则，同样会把后续工作带偏。\u003c/strong> 以上是机制分析，不是本次产品的实测结论。\u003c/p>\n\u003ch3>我们应该怎样验证，而不是只看演示？\u003c/h3>\n\u003cp>以下是建议实验，尚未执行。使用测试副本，避免真的操作重要照片。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>测试情景\u003c/th>\n\u003cth>观察什么\u003c/th>\n\u003cth>可以排查什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>普通短对话后再次提问\u003c/td>\n\u003ctd>当前条件是否仍保留\u003c/td>\n\u003ctd>最基本的记录与使用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大量对话后实际发生压缩\u003c/td>\n\u003ctd>压缩前后约束是否一致\u003c/td>\n\u003ctd>摘要是否丢失边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关闭后恢复同一任务\u003c/td>\n\u003ctd>能否找回对应状态\u003c/td>\n\u003ctd>恢复路径是否有效\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>用户明确改变原要求\u003c/td>\n\u003ctd>是否更新并保留修改依据\u003c/td>\n\u003ctd>旧规则是否错误延续\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超过记录容量或来源失效\u003c/td>\n\u003ctd>是否暴露缺失、停下或澄清\u003c/td>\n\u003ctd>静默遗忘与失败处理\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>每个情景都要看两个结果：系统保存了什么，以及最后实际做了什么。仅检查“记录里出现过这句话”不足以证明执行正确；仅看到一次正确行动，也不足以证明记录机制稳定。\u003c/p>\n\u003cp>可以进一步做同一组任务的对照：只用一般摘要，以及摘要加单独条件记录。比较违约次数、误拦截次数、回查次数和成本。测试时应变换措辞和例外，不让系统只记住一个固定题目。\u003c/p>\n\u003ch3>对你的知识库有什么实际启发？\u003c/h3>\n\u003cp>日报可以写得简洁，但学习进度需要保留“已介绍”和“用户反馈能应用”的区别；你某天没有回答题目，不能被摘要成“已掌握”。同样，“希望少代码”与“完全禁止任何代码示例”也不是同一个条件。\u003c/p>\n\u003cp>我们要保留的是足以影响后续教学的真实反馈，以及能回查的日期和原话，而非把所有聊天永久塞进每次输入。选哪些内容仍是一项判断，需要根据错误和反馈修正。\u003c/p>\n\u003cp>本期缺少独立复现、长任务下的统计对照，以及这种方案对你的知识库的实测收益。它值得观察的方向是“压缩时如何保留约束”，还不能据此断言长期 Agent 的遗忘问题已经解决。\u003c/p>\n\u003ch2>二、系统学习：缩短文字，可以改变命题\u003c/h2>\n\u003ch3>1. 先看一份虚构的活动通知\u003c/h3>\n\u003cp>以下全部是教学设定，不是实际活动安排：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对象 / 条件\u003c/th>\n\u003cth>时间\u003c/th>\n\u003cth>入口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>普通学员，非雨天\u003c/td>\n\u003ctd>9:00\u003c/td>\n\u003ctd>东门\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通学员，雨天\u003c/td>\n\u003ctd>9:00\u003c/td>\n\u003ctd>北门\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已登记的志愿者\u003c/td>\n\u003ctd>8:00\u003c/td>\n\u003ctd>西门\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>原文另有日期、版本及发布方，我们假定这些都已经核验。今天只观察压缩会不会改变条件。\u003c/p>\n\u003cp>一个不可靠的摘要是：\u003cstrong>“活动 9 点在东门签到。”\u003c/strong>\u003c/p>\n\u003cp>它读起来很顺，但没有说明适用对象和天气条件。“普通学员且非雨天”变成了读者可能理解的“大家都这样”。这不是少了几句无关描述，而是答案适用的范围改变了。\u003c/p>\n\u003ch3>2. 为什么这不一定是模型最后一步的疏漏？\u003c/h3>\n\u003cp>设想工具成功读取了上面的三行通知，但传给回答模型的只有那句摘要。你再问：“下雨时，普通学员走哪个门？”\u003c/p>\n\u003cp>原文中答案清楚；当前摘要里却没有答案。模型可能猜、误用东门，也可能指出信息不足。此时应优先检查\u003cstrong>摘要生成与传入环节\u003c/strong>。只要求回答模型“更认真”，无法可靠地补回已经被删掉的北门条件。\u003c/p>\n\u003cp>更大的上下文窗口，也不会自动把磁盘上的原文搬回来。不过，如果原文仍在当前上下文中，错误就可能更多涉及信息使用。这就是为什么排查时要查看实际输入，而不能只从错误答案倒推原因。\u003c/p>\n\u003cp>“完整传入”也不要求每次传入整份通知。对这个问题，至少要有普通学员的雨天入口、来源及适用性；与签到无关的茶点菜单可以不带。\u003c/p>\n\u003ch3>3. 更好的摘要保留条件，而非只留结论\u003c/h3>\n\u003cp>可以压成下面这段：\u003c/p>\n\u003cblockquote>\n\u003cp>普通学员 9:00 到场：非雨天东门，雨天北门；已登记志愿者 8:00 西门。以本期有效通知为准。原文定位：教学通知 v2，第 2 节“签到安排”。\u003c/p>\n\u003c/blockquote>\n\u003cp>这段不是完整原文，但保留了决定本题答案的分支。最后的原文定位也是教学示例，不是实际可点击来源。\u003c/p>\n\u003cp>一个实用记录框架是：\u003cstrong>对象、条件、结论、来源、未确定事项。\u003c/strong> 不必每条都写成长表；重点是不能让未知内容被压成肯定事实，也不能让局部规则变成无条件规则。\u003c/p>\n\u003cp>比如原文没说明“未登记志愿者”，摘要就应留下“该身份未说明”，而不是自行套用普通学员或已登记志愿者的安排。\u003c/p>\n\u003ch3>4. 摘要与原文各负责什么？\u003c/h3>\n\u003cp>可以把摘要想成一张出行提示卡。它让你快速知道大致安排；但当身份、日期或天气改变时，需要知道该去哪里核对。\u003c/p>\n\u003cp>类比的边界是：提示卡不会自己判断，Agent 的回查由程序流程或模型选择触发。仅写“原文见某处”，不保证它会回查，更不保证原文还能访问。\u003c/p>\n\u003cp>当问题涉及摘要没覆盖的条件、摘要与新通知冲突、来源版本不明时，应触发回读；读到了，还要核对是否为当前适用通知。拿不到原文时，可以解释已知安排，但对缺失条件说明无法确认，不能把摘要中的默认情况冒充已核验答案。\u003c/p>\n\u003cp>Anthropic 的上下文工程文章也提醒：过度压缩可能丢掉后来才显得重要的细节，并讨论用外部笔记维持任务状态。这是 \u003cstrong>2025-09-29 的背景资料，不是本周新闻\u003c/strong>。\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\">原始工程文章\u003c/a>\u003c/p>\n\u003ch3>5. 一个有回查出口的流程\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">保存原文位置与版本\n        ↓\n摘要保留对象、条件、例外与未知\n        ↓\n新问题是否被摘要充分覆盖？\n   ├─ 是 → 按适用条件回答，并核对来源\n   └─ 否 → 回读原文的相关段落\n                ├─ 找到有效依据 → 修订摘要，再回答\n                └─ 找不到 → 明确缺口，澄清或停止下结论\n\u003c/code>\u003c/pre>\n\u003cp>学习台的可点击图解逐步展示这些决定及失败点。它是教学流程，并非 Octomind 的内部架构。\u003c/p>\n\u003cp>这里的 Loop 在“发现缺口→回查→得到反馈→修订或停止”的连接中。仅生成第二遍摘要，不自动构成可靠纠错；第二遍也可能沿用第一遍的遗漏。回查需要带来新的、可核对的信息。\u003c/p>\n\u003ch3>6. 留下今天的一个新判断\u003c/h3>\n\u003cp>昨天你能问：“有没有读取？”今天再加一句：“读取后，传下来的说法是否仍保留决定答案的条件？”\u003c/p>\n\u003cp>不要把所有错误都归为窗口太小，也不要因为有摘要就认为已经保持连续性。要检查的是当前任务所需的信息，在获取、压缩、传入和使用之间有没有改变或丢失。\u003c/p>\n\u003cp>可复用笔记：\u003ca href=\"../%E6%A6%82%E5%BF%B5/%E6%91%98%E8%A6%81-%E6%9D%A1%E4%BB%B6%E4%B8%8E%E5%8E%9F%E6%96%87%E5%9B%9E%E6%9F%A5.md\">摘要、条件与原文回查\u003c/a>。下一步可学习：怎样设计能发现这类遗漏的检查题，以及“模型自评没问题”为什么不够。\u003c/p>\n\u003ch2>三、一道可选理解题\u003c/h2>\n\u003cp>\u003cstrong>工具已读到“雨天普通学员走北门”，传给回答模型的摘要却只剩“9 点东门”。模型答错后，你会优先修哪一环？只扩大窗口能保证修好吗？\u003c/strong>\u003c/p>\n\u003cp>用一两句话回答即可；不回答也继续下一期，不会因此记录为已掌握。\u003c/p>\n\u003ch2>四、我的笔记\u003c/h2>\n","text":"---\ndate: 2026-10-21\ntimezone: Asia/Shanghai\nissue: 4\ntags: [AI, Agent, Harness, 上下文, 记忆, 摘要, 可靠性]\nlevel: 入门\n---\n\n# AI 日报 004｜摘要留住了结论，却丢掉了条件\n\n日期：2026 年 10 月 21 日（北京时间）  \n阅读预算：进展与分析约 7 分钟；系统学习、点击图解与思考约 8 分钟。\n\n你已经能沿“获取→传入→使用”排查信息问题。今天不重讲这三个词，而是检查一个容易漏掉的地方：工具确实读到了原文，但后续只传入了一个改变原意的摘要。\n\n## 一、最新进展：关键规则怎样穿过上下文压缩？\n\n### 本期检索范围与证据\n\n本次过去 24 小时的检索未选出适合展开、且证据充分的重要更新，因此扩大到最近 7 天。本期只精选一项与当前学习直接相关的发布。下面的产品机制来自维护者说明；我核对了原始页面，但没有安装或独立复现产品，不把官方演示当成普遍效果证明。\n\n### Octomind 0.58.5：会话规则单独保留\n\n**官方文章日期：2026-10-17。** 这款 Agent 运行工具尝试把用户设定的会话规则保留在有损摘要之外，每轮重新带入；同一会话重启可继续使用，新的会话不自动继承。撤销规则需要明确表达，冲突请求本身不算撤销。官方报告了四轮重启测试，但该演示没有现场触发上下文压缩。规则捕获依赖模型分类，可能漏记；同时最多保留 8 条，新增第 9 条会移除最旧的一条。官方称另有测试覆盖压缩后的保留。[官方发布说明](https://octomind.run/blog/octomind-0-58-5-release)\n\n### 这项设计触及了什么问题？\n\n下面是独立教学例子，不代表产品的真实内部流程。\n\n假设你让助理整理相册，开始时明确说：“只整理副本，原始照片不能删。”后来发生了很多轮对话：挑选照片、比较尺寸、生成分类、讨论目录。为了继续工作，系统把旧对话压成一句：“用户希望清理相册，减少重复文件。”\n\n这句话保留了目标，却丢掉了行动边界。之后即使模型很认真地照摘要办事，也可能删除原始照片。问题不只在最后一步“有没有遵守指令”，还在更早的“哪些指令被传了下来”。\n\n从这个例子推导，值得分别记录的是：要达到什么目的、哪些动作有约束、约束在什么范围内有效、谁可以修改它。任务进展摘要与持续生效的约束承担不同职责，不宜让一句笼统总结代替两者。\n\n### 与普通摘要相比，改变的是哪一层？\n\n普通摘要主要回答：“之前谈了什么，事情做到哪了？”单独维护约束则增加一个问题：“接下来行动时，哪些条件仍须检查？”\n\n这是运行流程如何组织状态的问题，属于我们讨论的 Harness 职责之一。不是把模型训练得更聪明，也不是仅把最终回答润色一下。它会改变下一轮模型拿到的输入，以及系统据什么判断行动是否合适。\n\n但不能据此推断“把所有话都放进规则区就安全了”。临时要求可能只针对一次任务；旧约束可能已经撤销；两条规则可能冲突。记录越多，还越需要管理适用范围和更新。**留下错误或过期的规则，同样会把后续工作带偏。** 以上是机制分析，不是本次产品的实测结论。\n\n### 我们应该怎样验证，而不是只看演示？\n\n以下是建议实验，尚未执行。使用测试副本，避免真的操作重要照片。\n\n| 测试情景 | 观察什么 | 可以排查什么 |\n| --- | --- | --- |\n| 普通短对话后再次提问 | 当前条件是否仍保留 | 最基本的记录与使用 |\n| 大量对话后实际发生压缩 | 压缩前后约束是否一致 | 摘要是否丢失边界 |\n| 关闭后恢复同一任务 | 能否找回对应状态 | 恢复路径是否有效 |\n| 用户明确改变原要求 | 是否更新并保留修改依据 | 旧规则是否错误延续 |\n| 超过记录容量或来源失效 | 是否暴露缺失、停下或澄清 | 静默遗忘与失败处理 |\n\n每个情景都要看两个结果：系统保存了什么，以及最后实际做了什么。仅检查“记录里出现过这句话”不足以证明执行正确；仅看到一次正确行动，也不足以证明记录机制稳定。\n\n可以进一步做同一组任务的对照：只用一般摘要，以及摘要加单独条件记录。比较违约次数、误拦截次数、回查次数和成本。测试时应变换措辞和例外，不让系统只记住一个固定题目。\n\n### 对你的知识库有什么实际启发？\n\n日报可以写得简洁，但学习进度需要保留“已介绍”和“用户反馈能应用”的区别；你某天没有回答题目，不能被摘要成“已掌握”。同样，“希望少代码”与“完全禁止任何代码示例”也不是同一个条件。\n\n我们要保留的是足以影响后续教学的真实反馈，以及能回查的日期和原话，而非把所有聊天永久塞进每次输入。选哪些内容仍是一项判断，需要根据错误和反馈修正。\n\n本期缺少独立复现、长任务下的统计对照，以及这种方案对你的知识库的实测收益。它值得观察的方向是“压缩时如何保留约束”，还不能据此断言长期 Agent 的遗忘问题已经解决。\n\n## 二、系统学习：缩短文字，可以改变命题\n\n### 1. 先看一份虚构的活动通知\n\n以下全部是教学设定，不是实际活动安排：\n\n| 对象 / 条件 | 时间 | 入口 |\n| --- | --- | --- |\n| 普通学员，非雨天 | 9:00 | 东门 |\n| 普通学员，雨天 | 9:00 | 北门 |\n| 已登记的志愿者 | 8:00 | 西门 |\n\n原文另有日期、版本及发布方，我们假定这些都已经核验。今天只观察压缩会不会改变条件。\n\n一个不可靠的摘要是：**“活动 9 点在东门签到。”**\n\n它读起来很顺，但没有说明适用对象和天气条件。“普通学员且非雨天”变成了读者可能理解的“大家都这样”。这不是少了几句无关描述，而是答案适用的范围改变了。\n\n### 2. 为什么这不一定是模型最后一步的疏漏？\n\n设想工具成功读取了上面的三行通知，但传给回答模型的只有那句摘要。你再问：“下雨时，普通学员走哪个门？”\n\n原文中答案清楚；当前摘要里却没有答案。模型可能猜、误用东门，也可能指出信息不足。此时应优先检查**摘要生成与传入环节**。只要求回答模型“更认真”，无法可靠地补回已经被删掉的北门条件。\n\n更大的上下文窗口，也不会自动把磁盘上的原文搬回来。不过，如果原文仍在当前上下文中，错误就可能更多涉及信息使用。这就是为什么排查时要查看实际输入，而不能只从错误答案倒推原因。\n\n“完整传入”也不要求每次传入整份通知。对这个问题，至少要有普通学员的雨天入口、来源及适用性；与签到无关的茶点菜单可以不带。\n\n### 3. 更好的摘要保留条件，而非只留结论\n\n可以压成下面这段：\n\n> 普通学员 9:00 到场：非雨天东门，雨天北门；已登记志愿者 8:00 西门。以本期有效通知为准。原文定位：教学通知 v2，第 2 节“签到安排”。\n\n这段不是完整原文，但保留了决定本题答案的分支。最后的原文定位也是教学示例，不是实际可点击来源。\n\n一个实用记录框架是：**对象、条件、结论、来源、未确定事项。** 不必每条都写成长表；重点是不能让未知内容被压成肯定事实，也不能让局部规则变成无条件规则。\n\n比如原文没说明“未登记志愿者”，摘要就应留下“该身份未说明”，而不是自行套用普通学员或已登记志愿者的安排。\n\n### 4. 摘要与原文各负责什么？\n\n可以把摘要想成一张出行提示卡。它让你快速知道大致安排；但当身份、日期或天气改变时，需要知道该去哪里核对。\n\n类比的边界是：提示卡不会自己判断，Agent 的回查由程序流程或模型选择触发。仅写“原文见某处”，不保证它会回查，更不保证原文还能访问。\n\n当问题涉及摘要没覆盖的条件、摘要与新通知冲突、来源版本不明时，应触发回读；读到了，还要核对是否为当前适用通知。拿不到原文时，可以解释已知安排，但对缺失条件说明无法确认，不能把摘要中的默认情况冒充已核验答案。\n\nAnthropic 的上下文工程文章也提醒：过度压缩可能丢掉后来才显得重要的细节，并讨论用外部笔记维持任务状态。这是 **2025-09-29 的背景资料，不是本周新闻**。[原始工程文章](https://www.anthropic.com/research/effective-context-engineering-for-ai-agents)\n\n### 5. 一个有回查出口的流程\n\n```text\n保存原文位置与版本\n        ↓\n摘要保留对象、条件、例外与未知\n        ↓\n新问题是否被摘要充分覆盖？\n   ├─ 是 → 按适用条件回答，并核对来源\n   └─ 否 → 回读原文的相关段落\n                ├─ 找到有效依据 → 修订摘要，再回答\n                └─ 找不到 → 明确缺口，澄清或停止下结论\n```\n\n学习台的可点击图解逐步展示这些决定及失败点。它是教学流程，并非 Octomind 的内部架构。\n\n这里的 Loop 在“发现缺口→回查→得到反馈→修订或停止”的连接中。仅生成第二遍摘要，不自动构成可靠纠错；第二遍也可能沿用第一遍的遗漏。回查需要带来新的、可核对的信息。\n\n### 6. 留下今天的一个新判断\n\n昨天你能问：“有没有读取？”今天再加一句：“读取后，传下来的说法是否仍保留决定答案的条件？”\n\n不要把所有错误都归为窗口太小，也不要因为有摘要就认为已经保持连续性。要检查的是当前任务所需的信息，在获取、压缩、传入和使用之间有没有改变或丢失。\n\n可复用笔记：[摘要、条件与原文回查](../概念/摘要-条件与原文回查.md)。下一步可学习：怎样设计能发现这类遗漏的检查题，以及“模型自评没问题”为什么不够。\n\n## 三、一道可选理解题\n\n**工具已读到“雨天普通学员走北门”，传给回答模型的摘要却只剩“9 点东门”。模型答错后，你会优先修哪一环？只扩大窗口能保证修好吗？**\n\n用一两句话回答即可；不回答也继续下一期，不会因此记录为已掌握。\n\n## 四、我的笔记\n\n\u003c!-- 可补充问题、理解或偏好；后续更新保留。 -->\n","path":"日报/2026-10-21.md","visual":{"summary":"观察摘要怎样丢掉适用条件，并学习什么时候回查原文。","title":"从“9点东门”找回被丢掉的雨天分支","intro":"虚构活动通知：普通学员晴天东门、雨天北门，均9点；已登记志愿者8点西门。点击检查信息在压缩与回查之间怎样变化。","steps":[{"label":"保存原文定位","role":"来源与适用性","detail":"保留有效版本、章节与可访问位置。教学通知第2节区分学员、天气及登记志愿者。","failure":"路径存在但内容过期，或定位指向错误版本。"},{"label":"生成条件化摘要","role":"有取舍的压缩","detail":"保留“普通学员9点，非雨天东门、雨天北门；登记志愿者8点西门”。不能只写“活动9点东门”。未说明的身份应保留未知。","failure":"保留时间却删掉对象与天气，使局部结论变成无条件说法。"},{"label":"检查当前问题","role":"决定是否回查","detail":"问雨天学员去哪：若摘要包含且来源适用，可回答；若摘要只有东门，应转入回读，不能默认晴天规则适用。","failure":"把摘要没有写当成原文也没有规定，或用猜测填补。"},{"label":"回读并核对","role":"获取新证据","detail":"读取有效通知相关段落，确认雨天北门。若与摘要冲突，回到摘要步骤修订；若无法获得，应进入缺口说明。","failure":"只重新生成旧摘要，没有取得新证据；或回读去年版本。"},{"label":"回答或说明缺口","role":"行动与停止条件","detail":"有有效依据：按雨天普通学员9点北门回答并给来源。依据不足：明确哪条条件无法确认，澄清或停止下确定结论。","failure":"有来源链接就声称已经验证，或把未知压成肯定结论。"}],"feedback":{"from":4,"to":2,"label":"原文发现遗漏，修订摘要"},"footer":"教学简化流程，非Octomind真实架构。摘要覆盖且来源适用时可直接答；有缺口才回查。保存来源不保证实际读取，回读也不保证正确使用。"}},{"date":"2026-10-20","title":"AI 日报 003｜文件里有，不等于模型此刻看得到","tags":["AI","Agent","Harness","上下文","记忆","推理"],"html":"\u003ch1>AI 日报 003｜文件里有，不等于模型此刻看得到\u003c/h1>\n\u003cp>日期：2026 年 10 月 20 日（北京时间）\u003cbr>阅读预算：进展与观察约 7 分钟；系统学习、图解和思考约 8 分钟。\u003c/p>\n\u003cp>你昨天已经区分出“形成答案”和“调用计算器核验”。今天沿着这个理解前进：模型能推理，但它究竟依据什么信息推理？信息存在文件里，和信息进入当前任务，是两件事。\u003c/p>\n\u003ch2>一、最新进展：把资料留下来，同时减少每次携带的内容\u003c/h2>\n\u003ch3>范围说明\u003c/h3>\n\u003cp>过去 24 小时的检索未选出适合本课且有充分证据展开的重大技术发布，本期扩大到最近 7 天，选择一篇此前未报道的官方工程文章。它是近期技术解读，不是新模型发布，也不能据此认定文中机制都在当天首次出现。昨天的 RAGFlow 与前天的 Hindsight 不重复作为新闻。\u003c/p>\n\u003ch3>LangChain：Deep Agents 怎样管理上下文\u003c/h3>\n\u003cp>\u003cstrong>文章日期：2026-10-14。\u003c/strong> 官方介绍了把大结果移到文件、压缩旧对话、按需加载 Skills、隔离子任务上下文，以及用文件保存跨会话记忆的做法。主线是减少当前窗口里的负担，同时保留需要时找回资料的路径。\u003ca href=\"https://www.langchain.com/blog/context-engineering-deep-agents-remember\">官方工程文章\u003c/a>\u003c/p>\n\u003cp>**证据边界：**这是维护者的设计说明，不能直接当成统一的效果对照。文章描述了实现方法，但不足以证明所有任务都会更准，或某个配置适合你的知识库。本期未安装、运行或独立复现 Deep Agents。\u003c/p>\n\u003ch3>先看它触及了什么问题\u003c/h3>\n\u003cp>下面用一份虚构的活动筹备任务理解这个问题，例子不代表 Deep Agents 的内部实现。\u003c/p>\n\u003cp>你让助理为活动安排签到。资料包含：今年手册、去年手册、场地说明、几十页聊天记录，以及几版已废弃的草稿。写最终安排时，真正重要的可能是当前有效的入场规定、参与者类别、场地限制，以及尚未确认的事项。\u003c/p>\n\u003cp>如果把全部材料混在一起，助理要从大量信息里识别现行条件；如果只给一句摘要“活动早上开始”，又可能丢掉决定答案的细节。我们需要同时问两个问题：这一步必须看到什么？没有放进来的资料，以后还能怎样找到？\u003c/p>\n\u003cp>“少带一些”并不自动更好。若被移走的是当前有效通知，减少信息反而有害。因此评估点不是内容压缩了多少，而是关键约束和可追溯路径有没有留下。\u003c/p>\n\u003ch3>三种整理办法，会付出不同代价\u003c/h3>\n\u003cp>这张表是基于上述虚构任务的分析，不是产品性能数据。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>整理办法\u003c/th>\n\u003cth>可能帮助什么\u003c/th>\n\u003cth>可能损失什么\u003c/th>\n\u003cth>应检查什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>保留原文件，只带简短提示和位置\u003c/td>\n\u003ctd>避免每步反复携带全文\u003c/td>\n\u003ctd>后续可能不主动回读\u003c/td>\n\u003ctd>能否定位、访问并读到关键段落\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>把历史写成摘要\u003c/td>\n\u003ctd>快速恢复任务进展\u003c/td>\n\u003ctd>摘要会遗漏条件或把推断写成事实\u003c/td>\n\u003ctd>待确认事项、来源和冲突是否保留\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>将独立调查交给另一段任务处理\u003c/td>\n\u003ctd>减少主任务的杂乱材料\u003c/td>\n\u003ctd>返回结果可能隐藏限制或分歧\u003c/td>\n\u003ctd>是否带回证据、范围和未解决问题\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>你可以把它当作管理文件的提醒：归档路径解决“放在哪里”，摘要解决“快速了解什么”，核查机制解决“能否据此作答”。三种问题相关，但不能互相代替。\u003c/p>\n\u003ch3>和我们自己的日报有什么关系？\u003c/h3>\n\u003cp>你的知识库已分成日报、概念笔记和学习进度。今天生成前，我读取了学习进度，因此知道你在活动手册题里会核对时效与对象，也知道你仍需要澄清“预测与推理”的关系。这个连续性来自记录被实际读入本次任务；它不意味着模型权重因为昨天的聊天被永久更新。\u003c/p>\n\u003cp>如果以后更换模型，只要文件仍在、权限允许、流程仍会读取，记录可以继续被使用。但不同模型对同一记录的理解和执行可能不同，不能把文件可迁移理解为行为完全一致。\u003c/p>\n\u003ch3>接下来怎样判断这类方案有用？\u003c/h3>\n\u003cp>可以设计一个不写代码也能理解的小实验：准备同一个活动任务，分别给系统完整原文、摘要加来源、以及只有摘要。随后提出一个摘要没有明确写出的例外问题，例如“迟到的志愿者是否走同一入口”。\u003c/p>\n\u003cp>检查它是否找回原文，是否区分普通参与者和志愿者，缺资料时是否说明不确定。还应记录它用了几次查找、花了多少时间。这个实验是我们提出的检验思路，尚未执行；用它才能观察整理方式的代价，而不是仅凭演示流畅就下结论。\u003c/p>\n\u003cp>本期仍缺少的是：同一任务下不同机制的独立对照，以及在你的长期资料规模下的实际表现。先理解机制，再决定是否需要引入更复杂工具。\u003c/p>\n\u003ch2>二、系统学习：生成机制、任务能力和当前材料\u003c/h2>\n\u003ch3>1. 先校正一个会影响整张地图的推断\u003c/h3>\n\u003cp>“模型预测下一个 token”与“模型能完成某些推理任务”可以同时成立。\u003c/p>\n\u003cp>token 可以先理解为模型处理的文本单位，不一定等于一个汉字或一个词。常见自回归模型依据已有上下文计算下一个 token 的分布，逐步形成输出。GPT-3 研究同时报告了自回归生成与部分算术等任务表现，并展示无需更新权重、通过文本示例改变任务表现的情境。\u003ca href=\"https://arxiv.org/abs/2005.14165\">基础论文，2020-05-28\u003c/a>\u003c/p>\n\u003cp>这不会证明模型拥有人的全部理解，也不保证每次都能推理正确。它说明不能仅凭生成机制，就断定模型只会接词、不能处理关系。\u003c/p>\n\u003ch3>2. 用一个新规则分清“背过”与“依条件得出”\u003c/h3>\n\u003cp>假设现在告诉模型一个虚构规则：“甲班在东门签到；乙班在西门签到。小林属于乙班。”随后问：“小林去哪签到？”\u003c/p>\n\u003cp>得出“西门”，需要把身份和规则联系起来。这个例子让你看到怎样讨论任务层面的推理，但单个正确答案不足以证明稳定能力：还要换名字、改规则、加入例外，观察是否仍然成立。\u003c/p>\n\u003cp>可生成中间步骤，不等于这些步骤都正确，更不等于已经有独立验证。CoT 的经典研究观察到中间推理步骤示例能改善部分任务表现，但这与调用外部工具检查答案仍是两种机制。\u003ca href=\"https://arxiv.org/abs/2201.11903\">基础论文，2022-01-28\u003c/a>\u003c/p>\n\u003ch3>3. Prompt 改变“这一次依据什么”\u003c/h3>\n\u003cp>把上面的“乙班西门”改成“乙班南门”，本次应答就应随之改变。这种改变不要求立刻重新训练模型。\u003c/p>\n\u003cp>所以，你可以把 Prompt 理解为向这次任务提供规则、目标和材料。它不是直接给模型内部画一根精确的向量箭头。约束也不是越多越好：如果同时写“乙班走西门”和“所有人走南门”，还要说明优先级或澄清冲突。\u003c/p>\n\u003cp>现在只需分清两个时间尺度：训练得到的参数，构成模型已有能力的一部分；当前输入，提供这次任务的条件。两者都会影响结果，普通聊天里的指令通常不直接修改前者。\u003c/p>\n\u003ch3>4. 上下文像工作桌，长期记录像档案柜\u003c/h3>\n\u003cp>这是一个帮助记忆的类比，不是大脑结构说明。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>上下文\u003c/strong>：模型这次生成可以参考的输入，包括指令、对话片段、工具返回内容等。\u003c/li>\n\u003cli>\u003cstrong>上下文窗口\u003c/strong>：一次处理这些内容的容量限制；具体计量与输入输出预算由系统决定。\u003c/li>\n\u003cli>\u003cstrong>长期记录\u003c/strong>：文件或其他存储中留下的信息，需要被读取或检索，才会进入后续任务可参考的内容。\u003c/li>\n\u003c/ul>\n\u003cp>上下文工程关注选择和组织任务所需材料，不只是把提示词写得更长。\u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\">基础工程资料，2025-09-29\u003c/a>\u003c/p>\n\u003cp>档案柜里有今年通知，不代表桌面上正在看的就是它。桌面放得下很多纸，也不代表每张纸都同样容易被正确使用。更大的窗口提供容量，不能单独保证检索、相关性判断或推理正确。\u003c/p>\n\u003ch3>5. 沿你的日报走一遍信息路径\u003c/h3>\n\u003cpre>\u003ccode class=\"language-text\">你的反馈：不写代码，希望用图理解\n          ↓ 保存\n学习进度.md 等长期记录\n          ↓ 实际读取 / 选取相关内容\n今天任务的上下文\n          ↓ 模型结合当前问题处理\n适合当前程度的解释与图解\n          ↓ 与你的反馈比较\n更新记录，或澄清后继续\n\u003c/code>\u003c/pre>\n\u003cp>若输出突然充满代码，可以分层排查：偏好是否存对了？是否实际读取？读入后有没有与其他要求冲突？模型是否仍未遵循？同一个症状，可能来自不同环节。\u003c/p>\n\u003cp>这里也能重新定位 RAG：它是从外部资料找出相关信息并辅助生成的一种方法。长期存储、检索、上下文是不同职责；记忆系统可以把它们组织起来，但不能把每一个都叫作同一件事。\u003c/p>\n\u003ch3>6. 回到昨天的 Loop\u003c/h3>\n\u003cp>模型推导一个结果，工具给出反馈，系统再决定修改或结束。今天增加的是：反馈必须进入后续可参考的材料，才有机会影响下一步。\u003c/p>\n\u003cp>工具在屏幕上显示了“验证失败”，但这个结果没有正确传回模型或流程，循环就可能继续沿着原错误走。可见，“调用过工具”和“根据工具结果改变行动”仍然要分开检查。\u003c/p>\n\u003cp>今天只要求你区分：\u003cstrong>模型有什么能力、这一次拿到什么材料、系统怎样把反馈接回下一步。\u003c/strong> 不需要记算法细节。\u003c/p>\n\u003cp>可回顾：\u003ca href=\"../%E6%A6%82%E5%BF%B5/%E9%A2%84%E6%B5%8B-%E4%B8%8A%E4%B8%8B%E6%96%87%E4%B8%8E%E9%95%BF%E6%9C%9F%E8%AE%B0%E5%BD%95.md\">预测、上下文与长期记录\u003c/a>。下一期建议用“摘要遗漏例外条件”的案例，理解怎样压缩记录并保留回查路径。\u003c/p>\n\u003ch2>三、一道可选理解题\u003c/h2>\n\u003cp>\u003cstrong>你在学习进度文件中写了“请用生活例子解释”，但下一次模型没有读取它。即使上下文窗口更大，它就一定会遵循这条偏好吗？你会先检查哪一步？\u003c/strong>\u003c/p>\n\u003cp>回答一两句即可。这里考的是信息怎样进入任务，不是术语记忆。\u003c/p>\n\u003ch2>四、我的笔记\u003c/h2>\n","text":"---\ndate: 2026-10-20\ntimezone: Asia/Shanghai\nissue: 3\ntags: [AI, Agent, Harness, 上下文, 记忆, 推理]\nlevel: 入门\n---\n\n# AI 日报 003｜文件里有，不等于模型此刻看得到\n\n日期：2026 年 10 月 20 日（北京时间）  \n阅读预算：进展与观察约 7 分钟；系统学习、图解和思考约 8 分钟。\n\n你昨天已经区分出“形成答案”和“调用计算器核验”。今天沿着这个理解前进：模型能推理，但它究竟依据什么信息推理？信息存在文件里，和信息进入当前任务，是两件事。\n\n## 一、最新进展：把资料留下来，同时减少每次携带的内容\n\n### 范围说明\n\n过去 24 小时的检索未选出适合本课且有充分证据展开的重大技术发布，本期扩大到最近 7 天，选择一篇此前未报道的官方工程文章。它是近期技术解读，不是新模型发布，也不能据此认定文中机制都在当天首次出现。昨天的 RAGFlow 与前天的 Hindsight 不重复作为新闻。\n\n### LangChain：Deep Agents 怎样管理上下文\n\n**文章日期：2026-10-14。** 官方介绍了把大结果移到文件、压缩旧对话、按需加载 Skills、隔离子任务上下文，以及用文件保存跨会话记忆的做法。主线是减少当前窗口里的负担，同时保留需要时找回资料的路径。[官方工程文章](https://www.langchain.com/blog/context-engineering-deep-agents-remember)\n\n**证据边界：**这是维护者的设计说明，不能直接当成统一的效果对照。文章描述了实现方法，但不足以证明所有任务都会更准，或某个配置适合你的知识库。本期未安装、运行或独立复现 Deep Agents。\n\n### 先看它触及了什么问题\n\n下面用一份虚构的活动筹备任务理解这个问题，例子不代表 Deep Agents 的内部实现。\n\n你让助理为活动安排签到。资料包含：今年手册、去年手册、场地说明、几十页聊天记录，以及几版已废弃的草稿。写最终安排时，真正重要的可能是当前有效的入场规定、参与者类别、场地限制，以及尚未确认的事项。\n\n如果把全部材料混在一起，助理要从大量信息里识别现行条件；如果只给一句摘要“活动早上开始”，又可能丢掉决定答案的细节。我们需要同时问两个问题：这一步必须看到什么？没有放进来的资料，以后还能怎样找到？\n\n“少带一些”并不自动更好。若被移走的是当前有效通知，减少信息反而有害。因此评估点不是内容压缩了多少，而是关键约束和可追溯路径有没有留下。\n\n### 三种整理办法，会付出不同代价\n\n这张表是基于上述虚构任务的分析，不是产品性能数据。\n\n| 整理办法 | 可能帮助什么 | 可能损失什么 | 应检查什么 |\n| --- | --- | --- | --- |\n| 保留原文件，只带简短提示和位置 | 避免每步反复携带全文 | 后续可能不主动回读 | 能否定位、访问并读到关键段落 |\n| 把历史写成摘要 | 快速恢复任务进展 | 摘要会遗漏条件或把推断写成事实 | 待确认事项、来源和冲突是否保留 |\n| 将独立调查交给另一段任务处理 | 减少主任务的杂乱材料 | 返回结果可能隐藏限制或分歧 | 是否带回证据、范围和未解决问题 |\n\n你可以把它当作管理文件的提醒：归档路径解决“放在哪里”，摘要解决“快速了解什么”，核查机制解决“能否据此作答”。三种问题相关，但不能互相代替。\n\n### 和我们自己的日报有什么关系？\n\n你的知识库已分成日报、概念笔记和学习进度。今天生成前，我读取了学习进度，因此知道你在活动手册题里会核对时效与对象，也知道你仍需要澄清“预测与推理”的关系。这个连续性来自记录被实际读入本次任务；它不意味着模型权重因为昨天的聊天被永久更新。\n\n如果以后更换模型，只要文件仍在、权限允许、流程仍会读取，记录可以继续被使用。但不同模型对同一记录的理解和执行可能不同，不能把文件可迁移理解为行为完全一致。\n\n### 接下来怎样判断这类方案有用？\n\n可以设计一个不写代码也能理解的小实验：准备同一个活动任务，分别给系统完整原文、摘要加来源、以及只有摘要。随后提出一个摘要没有明确写出的例外问题，例如“迟到的志愿者是否走同一入口”。\n\n检查它是否找回原文，是否区分普通参与者和志愿者，缺资料时是否说明不确定。还应记录它用了几次查找、花了多少时间。这个实验是我们提出的检验思路，尚未执行；用它才能观察整理方式的代价，而不是仅凭演示流畅就下结论。\n\n本期仍缺少的是：同一任务下不同机制的独立对照，以及在你的长期资料规模下的实际表现。先理解机制，再决定是否需要引入更复杂工具。\n\n## 二、系统学习：生成机制、任务能力和当前材料\n\n### 1. 先校正一个会影响整张地图的推断\n\n“模型预测下一个 token”与“模型能完成某些推理任务”可以同时成立。\n\ntoken 可以先理解为模型处理的文本单位，不一定等于一个汉字或一个词。常见自回归模型依据已有上下文计算下一个 token 的分布，逐步形成输出。GPT-3 研究同时报告了自回归生成与部分算术等任务表现，并展示无需更新权重、通过文本示例改变任务表现的情境。[基础论文，2020-05-28](https://arxiv.org/abs/2005.14165)\n\n这不会证明模型拥有人的全部理解，也不保证每次都能推理正确。它说明不能仅凭生成机制，就断定模型只会接词、不能处理关系。\n\n### 2. 用一个新规则分清“背过”与“依条件得出”\n\n假设现在告诉模型一个虚构规则：“甲班在东门签到；乙班在西门签到。小林属于乙班。”随后问：“小林去哪签到？”\n\n得出“西门”，需要把身份和规则联系起来。这个例子让你看到怎样讨论任务层面的推理，但单个正确答案不足以证明稳定能力：还要换名字、改规则、加入例外，观察是否仍然成立。\n\n可生成中间步骤，不等于这些步骤都正确，更不等于已经有独立验证。CoT 的经典研究观察到中间推理步骤示例能改善部分任务表现，但这与调用外部工具检查答案仍是两种机制。[基础论文，2022-01-28](https://arxiv.org/abs/2201.11903)\n\n### 3. Prompt 改变“这一次依据什么”\n\n把上面的“乙班西门”改成“乙班南门”，本次应答就应随之改变。这种改变不要求立刻重新训练模型。\n\n所以，你可以把 Prompt 理解为向这次任务提供规则、目标和材料。它不是直接给模型内部画一根精确的向量箭头。约束也不是越多越好：如果同时写“乙班走西门”和“所有人走南门”，还要说明优先级或澄清冲突。\n\n现在只需分清两个时间尺度：训练得到的参数，构成模型已有能力的一部分；当前输入，提供这次任务的条件。两者都会影响结果，普通聊天里的指令通常不直接修改前者。\n\n### 4. 上下文像工作桌，长期记录像档案柜\n\n这是一个帮助记忆的类比，不是大脑结构说明。\n\n- **上下文**：模型这次生成可以参考的输入，包括指令、对话片段、工具返回内容等。\n- **上下文窗口**：一次处理这些内容的容量限制；具体计量与输入输出预算由系统决定。\n- **长期记录**：文件或其他存储中留下的信息，需要被读取或检索，才会进入后续任务可参考的内容。\n\n上下文工程关注选择和组织任务所需材料，不只是把提示词写得更长。[基础工程资料，2025-09-29](https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents)\n\n档案柜里有今年通知，不代表桌面上正在看的就是它。桌面放得下很多纸，也不代表每张纸都同样容易被正确使用。更大的窗口提供容量，不能单独保证检索、相关性判断或推理正确。\n\n### 5. 沿你的日报走一遍信息路径\n\n```text\n你的反馈：不写代码，希望用图理解\n          ↓ 保存\n学习进度.md 等长期记录\n          ↓ 实际读取 / 选取相关内容\n今天任务的上下文\n          ↓ 模型结合当前问题处理\n适合当前程度的解释与图解\n          ↓ 与你的反馈比较\n更新记录，或澄清后继续\n```\n\n若输出突然充满代码，可以分层排查：偏好是否存对了？是否实际读取？读入后有没有与其他要求冲突？模型是否仍未遵循？同一个症状，可能来自不同环节。\n\n这里也能重新定位 RAG：它是从外部资料找出相关信息并辅助生成的一种方法。长期存储、检索、上下文是不同职责；记忆系统可以把它们组织起来，但不能把每一个都叫作同一件事。\n\n### 6. 回到昨天的 Loop\n\n模型推导一个结果，工具给出反馈，系统再决定修改或结束。今天增加的是：反馈必须进入后续可参考的材料，才有机会影响下一步。\n\n工具在屏幕上显示了“验证失败”，但这个结果没有正确传回模型或流程，循环就可能继续沿着原错误走。可见，“调用过工具”和“根据工具结果改变行动”仍然要分开检查。\n\n今天只要求你区分：**模型有什么能力、这一次拿到什么材料、系统怎样把反馈接回下一步。** 不需要记算法细节。\n\n可回顾：[预测、上下文与长期记录](../概念/预测-上下文与长期记录.md)。下一期建议用“摘要遗漏例外条件”的案例，理解怎样压缩记录并保留回查路径。\n\n## 三、一道可选理解题\n\n**你在学习进度文件中写了“请用生活例子解释”，但下一次模型没有读取它。即使上下文窗口更大，它就一定会遵循这条偏好吗？你会先检查哪一步？**\n\n回答一两句即可。这里考的是信息怎样进入任务，不是术语记忆。\n\n## 四、我的笔记\n\n\u003c!-- 可补充问题、理解或偏好；后续更新保留。 -->\n","path":"日报/2026-10-20.md","visual":{"summary":"从Deep Agents近期工程文章出发，区分生成机制、当前上下文和长期记录。","title":"偏好写进文件后，怎样影响下一次回答？","intro":"教学例子：你希望用生活例子学习。点击步骤检查信息如何从存储进入当前任务；若偏好缺失，回到读取环节。","steps":[{"label":"保存明确反馈","role":"长期记录","detail":"把“基本不写代码，请用生活例子”记入学习进度，并区分临时要求与持续偏好。保存不意味着模型权重已经改变。","failure":"记录失真、遗漏条件或把临时例外当成长期规则。"},{"label":"读取相关记录","role":"信息进入任务","detail":"后续运行实际访问文件，选出与今天教学有关的记录；文件可访问、位置正确是前提。","failure":"文件虽在，但没有读取，或读取了错误版本。"},{"label":"组织本次材料","role":"上下文","detail":"把当前问题、相关偏好、必要来源和限制组合起来。上下文窗口提供容量，不负责自动读取全部文件。","failure":"偏好没进入、被摘要丢失，或与其他要求冲突。"},{"label":"处理并生成","role":"模型能力","detail":"模型依据当前材料推导并组织解释。token生成机制与推理能力并不矛盾，但结果仍可能不符合要求。","failure":"看到了偏好也可能执行失败；不能据输出倒推所有内部过程。"},{"label":"比较并决定","role":"反馈 / Loop","detail":"检查是否使用生活例子。若偏好未传入则回查读取路径；若传入仍失效则检查冲突或调整指令，满足条件后结束。","failure":"只看到“已保存”就认定下次必定遵循。"}],"feedback":{"from":5,"to":2,"label":"偏好未传入，检查读取路径"},"footer":"这是学习连续性的信息路径示意，不是Deep Agents或模型内部结构。除回查外，系统还可修正指令、澄清或停止；大窗口不等于自动拥有长期记忆。"}},{"date":"2026-10-19","title":"AI 日报 002｜RAG：查到了资料，为什么还会答错？","tags":["AI","RAG","Agent","检索","证据","可靠性"],"html":"\u003ch1>AI 日报 002｜RAG：查到了资料，为什么还会答错？\u003c/h1>\n\u003cp>日期：2026 年 10 月 19 日（北京时间）\u003cbr>阅读安排：进展与观察约 7 分钟；系统学习、互动图解与思考约 8 分钟。\u003c/p>\n\u003cp>昨天我们把 Agent 理解为围绕目标、依据反馈推进任务的系统。今天只深入其中一步：\u003cstrong>外部资料怎样变成一份有根据的回答？\u003c/strong> 尚未收到昨天理解题的回答，因此昨天的概念仍记为“已介绍”，无需先答题才能继续。\u003c/p>\n\u003ch2>一、最新进展：从“能搜到”走向“把检索组织起来”\u003c/h2>\n\u003ch3>本期范围与核验说明\u003c/h3>\n\u003cp>本次检索没有选出适合展开且已充分核验的过去 24 小时重大技术发布，因此扩大到最近 7 天，只精选一项与学习路线直接相关的版本更新。没有重复昨天的 Hindsight 和 Anthropic 报告。后面的旧资料用于解释基础，均明确标注日期。\u003c/p>\n\u003ch3>RAGFlow v1.0.0-rc2：检索产品继续加入 Agent 能力\u003c/h3>\n\u003cp>\u003cstrong>发布日期：2026-10-16。\u003c/strong> 维护者在版本说明中列出 Agentic 聊天模式、内置文档解析器与 Pipeline 解析器统一，以及新的网页搜索工具支持。它是第二个候选版本；“候选”表示仍处于正式版前的验证阶段。\u003ca href=\"https://github.com/infiniflow/ragflow/releases/tag/v1.0.0-rc2\">官方发布记录\u003c/a>\u003c/p>\n\u003cp>**已经确认的事实：**发布说明包含上述改动。**尚不能据此确认：**回答更准确、每次都应采用 Agentic 模式，或者新解析流程在所有文件类型上都更好。版本记录没有为这些结论提供统一的对照实验。\u003c/p>\n\u003ch3>为什么这件事值得理解？\u003c/h3>\n\u003cp>以下是帮助理解的假设，不是 RAGFlow 内部实现说明。\u003c/p>\n\u003cp>假设你要问一家公司：“今年出差的住宿上限是多少？”资料分散在旧制度、新通知和几份扫描附件里。一个简单流程可能先搜索，再把找到的片段交给模型回答。若第一轮找到的是旧制度，后面的文字即使写得顺畅，也可能已经偏离问题。\u003c/p>\n\u003cp>一个允许模型选择后续动作的流程，则可能在发现文件年份不符后，换一个查询继续寻找，再比较两份文件的适用日期。这里改变的是\u003cstrong>怎样组织查找和判断\u003c/strong>。增加一个 Agent，并没有让资料自动变得正确。\u003c/p>\n\u003cp>因此，“Agentic”值得追问的是：它能依据什么反馈改变检索？什么时候停止？查不到时如何报告？仅看一个模式名称，无法回答这些问题。\u003c/p>\n\u003ch3>文档解析为什么也值得关注？\u003c/h3>\n\u003cp>还是上面的虚构例子。假设附件中的表格有三列：地区、住宿上限、例外条件。如果转换成文本时把列的关系弄乱，系统可能找到正确的数字，却把它配给错误的地区。\u003c/p>\n\u003cp>我们会关心解析功能，因为它决定后续步骤能接触到什么材料。这个例子并不证明此次版本已经解决表格错配；它只是给出一个可检查的问题：在你的文件里，表头、数字、脚注和来源位置有没有被保留下来？\u003c/p>\n\u003cp>**我的判断：**这次更新适合作为观察窗口，提醒我们同时看“材料如何进入系统”和“系统如何决定继续查找”。两者都有价值，任何一项都不能单独保证最终可靠。\u003c/p>\n\u003ch3>如果你要判断类似产品，先看什么？\u003c/h3>\n\u003cp>不需要安装产品，也能先写出一份小型考题清单：\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>虚构测试情境\u003c/th>\n\u003cth>希望看到的行为\u003c/th>\n\u003cth>不能只看什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>有新旧两版规则\u003c/td>\n\u003ctd>说明采用哪版、为何适用\u003c/td>\n\u003ctd>回答是否流畅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>规则在表格脚注里\u003c/td>\n\u003ctd>正确关联数字与条件\u003c/td>\n\u003ctd>是否提到相近关键词\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>两份资料相互矛盾\u003c/td>\n\u003ctd>展示冲突与日期，不强行合并\u003c/td>\n\u003ctd>是否给出唯一答案\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>根本没有答案\u003c/td>\n\u003ctd>明确缺少依据或提出澄清\u003c/td>\n\u003ctd>引用链接的数量\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>这是一份我们提出的评估方法，尚未用它测试该版本。测试时应让不同方案面对同一批问题、同一份资料，并记录正确率、花费和等待时间。先把“好”定义清楚，才知道新功能有没有改善你关心的问题。\u003c/p>\n\u003cp>**接下来观察什么：**该候选版本后续修复了哪些具体问题？有没有贴近真实文件的可复核实验？同样的任务，采用更复杂的检索组织后，收益是否值得成本？今天先保留这些问题，不急着给产品排位。\u003c/p>\n\u003ch2>二、系统学习：RAG 像一场带资料的答题\u003c/h2>\n\u003ch3>1. 一个足够用的定义\u003c/h3>\n\u003cp>RAG 是 Retrieval-Augmented Generation，中文常译“检索增强生成”。先从外部资料中找相关信息，再让模型参考这些信息生成回答。它并不要求把新知识永久写入模型本身。\u003c/p>\n\u003cp>RAG 的经典研究把生成模型与可检索的外部知识结合；今天产品中的实现形式更多，本课只讲共同思路。\u003ca href=\"https://arxiv.org/abs/2005.11401\">原始论文，首次提交于 2020-05-22\u003c/a>\u003c/p>\n\u003cp>可以把它想成带资料答题：资料不必都背下来，但必须找对、看懂，并回答题目真正问的内容。类比的边界是，模型没有人类那样自然的常识检查；给它一段资料，不代表它一定正确使用。\u003c/p>\n\u003ch3>2. 先分开“准备资料”和“回答问题”\u003c/h3>\n\u003cp>下面是教学简图，不是任何产品的完整架构。简单系统也可能直接读取整份文件，不必具备全部步骤。\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">准备阶段：文件 → 提取文字与结构 → 划分片段并保留来源 → 建立检索索引\n\n回答阶段：问题 → 查找候选片段 → 核对相关性与适用范围 → 根据证据回答\n                                            │\n                            证据不足 ────────┘\n                               ↓\n                  补查、澄清，或说明目前无法确定\n\u003c/code>\u003c/pre>\n\u003cp>为什么要分两条线？假设某段关键信息根本没有成功进入索引，反复换措辞搜索，仍可能找不到。此时需要回看资料准备阶段。不能把所有错误都归到最后写答案的模型身上。\u003c/p>\n\u003cp>“索引”在这里先理解为帮助定位内容的目录或地图即可。它不只可以按关键词，也可以按含义建立联系；具体算法留到后面再学。\u003c/p>\n\u003ch3>3. 用一份虚构的活动手册走一遍\u003c/h3>\n\u003cp>假设有三份材料：\u003c/p>\n\u003cul>\n\u003cli>2025 年手册：活动 8:30 开始。\u003c/li>\n\u003cli>2026 年正式通知：活动 9:00 开始。\u003c/li>\n\u003cli>2026 年志愿者说明：工作人员 8:00 到场。\u003c/li>\n\u003c/ul>\n\u003cp>现在问：“今年我作为普通参与者，几点到？”\u003c/p>\n\u003cp>\u003cstrong>第一关：问题中的条件。\u003c/strong>“今年”“普通参与者”都在限制答案。只搜索“几点”，可能同时找到三个看似相关的时间。\u003c/p>\n\u003cp>**第二关：材料中的范围。**年份、对象、文件状态需要一起看。语义相近并不等于对当前问题适用。\u003c/p>\n\u003cp>\u003cstrong>第三关：证据是否足够。\u003c/strong>“9:00 开始”不等于“9:00 到场就来得及”。如果没有签到时间，只能据实说明活动开始时间，不能凭感觉补出签到要求。\u003c/p>\n\u003cp>**第四关：说清依据。**回答应让你看出哪些来自通知，哪些目前缺资料。如果后续发现新通知被撤销，还要回到证据选择环节，而不是继续沿旧结论生成。\u003c/p>\n\u003cp>这说明 RAG 的价值不只是提供额外文字，而是让回答有机会建立在可检查的材料上。材料有没有覆盖你的问题、回答有没有越过证据，仍然要分别检查。\u003c/p>\n\u003ch3>4. 三种不同的失败，分别检查\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>失败类型\u003c/th>\n\u003cth>活动手册中的表现\u003c/th>\n\u003cth>优先检查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>准备有缺漏\u003c/td>\n\u003ctd>2026 年正式通知没有被正确提取\u003c/td>\n\u003ctd>原文件、提取结果、索引更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>检索选错\u003c/td>\n\u003ctd>找到了旧手册，漏掉新通知\u003c/td>\n\u003ctd>查询条件、候选结果、日期与对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成越界\u003c/td>\n\u003ctd>资料只说9点开始，却回答8点半必须签到\u003c/td>\n\u003ctd>回答中的每个结论是否有依据\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>遇到错误时，这张表比“换一个更强模型试试”更能帮你定位问题。更强模型可能改善某些环节，却不能凭空还原没有送达的信息。\u003c/p>\n\u003ch3>5. 为什么片段要带“身份”？\u003c/h3>\n\u003cp>只摘出“9:00 开始”，可能丢掉年份和对象。若连同“2026年正式通知、普通参与者活动安排、原文所在位置”保存，可核查性更好。\u003c/p>\n\u003cp>一种已有的改进思路是在片段前补充它在原文中的背景，以帮助检索。这是 Contextual Retrieval 的核心思路之一；背景由模型生成时，也需要检查是否准确。\u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\">基础资料，2024-09-19\u003c/a>\u003c/p>\n\u003cp>对你的知识库，一个轻量做法就是保留日报日期、概念主题、来源链接和适用说明。目前的 HTML 搜索是标题与正文的关键词检索，并不是完整的自动 RAG 问答系统；它让你查阅资料，不会自动根据检索结果生成答案。\u003c/p>\n\u003ch3>今天先记住这句话\u003c/h3>\n\u003cp>\u003cstrong>检索到相关材料，是回答问题的起点；材料是否适用、结论是否得到支持，是另外两次检查。\u003c/strong>\u003c/p>\n\u003cp>打开学习台的互动图解，可以逐步查看“确认条件→找候选→核对版本→组织回答→检查支持”的链条。未通过核对时，箭头返回查找环节；实际系统也可以请求澄清或停止。\u003c/p>\n\u003cp>可复习：\u003ca href=\"../%E6%A6%82%E5%BF%B5/RAG%E4%B8%8E%E8%AF%81%E6%8D%AE%E9%93%BE.md\">RAG与证据链\u003c/a>。下一步建议学习“上下文”：被找到的材料怎样进入模型此刻能参考的内容，以及它与长期保存的记忆有什么区别。\u003c/p>\n\u003ch2>三、一道可选理解题\u003c/h2>\n\u003cp>\u003cstrong>AI 为你附了三条引用，但引用全来自去年的活动手册。它已经可靠地回答了“今年普通参与者几点到场”吗？你最想让它补查哪一项信息？\u003c/strong>\u003c/p>\n\u003cp>用自己的话回答一两句即可，不需要记住术语。\u003c/p>\n\u003ch2>四、我的笔记\u003c/h2>\n\u003ch3>学习反馈补充（2026-10-19）\u003c/h3>\n\u003cp>用户提出：核对当前年份、查今年手册、缺少最新资料时明确注明，并限定普通参与者身份。能在本例应用时效性与对象检查；旧版是否仍有效及引用是否支持结论需继续核查。\u003c/p>\n\u003cp>用户自评：资料不够完整，年份/对象/版本尚可，结论比较有依据。后续加强背景、缺失条件和证据覆盖说明。\u003c/p>\n\u003cp>对系统概念的主动复述及纠偏见：\u003ca href=\"../%E6%A6%82%E5%BF%B5/%E7%B3%BB%E7%BB%9F%E6%A6%82%E5%BF%B5%E7%BA%A0%E5%81%8F-2026-10-19.md\">系统概念纠偏\u003c/a>。\u003c/p>\n","text":"---\ndate: 2026-10-19\ntimezone: Asia/Shanghai\nissue: 2\ntags: [AI, RAG, Agent, 检索, 证据, 可靠性]\nlevel: 入门\n---\n\n# AI 日报 002｜RAG：查到了资料，为什么还会答错？\n\n日期：2026 年 10 月 19 日（北京时间）  \n阅读安排：进展与观察约 7 分钟；系统学习、互动图解与思考约 8 分钟。\n\n昨天我们把 Agent 理解为围绕目标、依据反馈推进任务的系统。今天只深入其中一步：**外部资料怎样变成一份有根据的回答？** 尚未收到昨天理解题的回答，因此昨天的概念仍记为“已介绍”，无需先答题才能继续。\n\n## 一、最新进展：从“能搜到”走向“把检索组织起来”\n\n### 本期范围与核验说明\n\n本次检索没有选出适合展开且已充分核验的过去 24 小时重大技术发布，因此扩大到最近 7 天，只精选一项与学习路线直接相关的版本更新。没有重复昨天的 Hindsight 和 Anthropic 报告。后面的旧资料用于解释基础，均明确标注日期。\n\n### RAGFlow v1.0.0-rc2：检索产品继续加入 Agent 能力\n\n**发布日期：2026-10-16。** 维护者在版本说明中列出 Agentic 聊天模式、内置文档解析器与 Pipeline 解析器统一，以及新的网页搜索工具支持。它是第二个候选版本；“候选”表示仍处于正式版前的验证阶段。[官方发布记录](https://github.com/infiniflow/ragflow/releases/tag/v1.0.0-rc2)\n\n**已经确认的事实：**发布说明包含上述改动。**尚不能据此确认：**回答更准确、每次都应采用 Agentic 模式，或者新解析流程在所有文件类型上都更好。版本记录没有为这些结论提供统一的对照实验。\n\n### 为什么这件事值得理解？\n\n以下是帮助理解的假设，不是 RAGFlow 内部实现说明。\n\n假设你要问一家公司：“今年出差的住宿上限是多少？”资料分散在旧制度、新通知和几份扫描附件里。一个简单流程可能先搜索，再把找到的片段交给模型回答。若第一轮找到的是旧制度，后面的文字即使写得顺畅，也可能已经偏离问题。\n\n一个允许模型选择后续动作的流程，则可能在发现文件年份不符后，换一个查询继续寻找，再比较两份文件的适用日期。这里改变的是**怎样组织查找和判断**。增加一个 Agent，并没有让资料自动变得正确。\n\n因此，“Agentic”值得追问的是：它能依据什么反馈改变检索？什么时候停止？查不到时如何报告？仅看一个模式名称，无法回答这些问题。\n\n### 文档解析为什么也值得关注？\n\n还是上面的虚构例子。假设附件中的表格有三列：地区、住宿上限、例外条件。如果转换成文本时把列的关系弄乱，系统可能找到正确的数字，却把它配给错误的地区。\n\n我们会关心解析功能，因为它决定后续步骤能接触到什么材料。这个例子并不证明此次版本已经解决表格错配；它只是给出一个可检查的问题：在你的文件里，表头、数字、脚注和来源位置有没有被保留下来？\n\n**我的判断：**这次更新适合作为观察窗口，提醒我们同时看“材料如何进入系统”和“系统如何决定继续查找”。两者都有价值，任何一项都不能单独保证最终可靠。\n\n### 如果你要判断类似产品，先看什么？\n\n不需要安装产品，也能先写出一份小型考题清单：\n\n| 虚构测试情境 | 希望看到的行为 | 不能只看什么 |\n| --- | --- | --- |\n| 有新旧两版规则 | 说明采用哪版、为何适用 | 回答是否流畅 |\n| 规则在表格脚注里 | 正确关联数字与条件 | 是否提到相近关键词 |\n| 两份资料相互矛盾 | 展示冲突与日期，不强行合并 | 是否给出唯一答案 |\n| 根本没有答案 | 明确缺少依据或提出澄清 | 引用链接的数量 |\n\n这是一份我们提出的评估方法，尚未用它测试该版本。测试时应让不同方案面对同一批问题、同一份资料，并记录正确率、花费和等待时间。先把“好”定义清楚，才知道新功能有没有改善你关心的问题。\n\n**接下来观察什么：**该候选版本后续修复了哪些具体问题？有没有贴近真实文件的可复核实验？同样的任务，采用更复杂的检索组织后，收益是否值得成本？今天先保留这些问题，不急着给产品排位。\n\n## 二、系统学习：RAG 像一场带资料的答题\n\n### 1. 一个足够用的定义\n\nRAG 是 Retrieval-Augmented Generation，中文常译“检索增强生成”。先从外部资料中找相关信息，再让模型参考这些信息生成回答。它并不要求把新知识永久写入模型本身。\n\nRAG 的经典研究把生成模型与可检索的外部知识结合；今天产品中的实现形式更多，本课只讲共同思路。[原始论文，首次提交于 2020-05-22](https://arxiv.org/abs/2005.11401)\n\n可以把它想成带资料答题：资料不必都背下来，但必须找对、看懂，并回答题目真正问的内容。类比的边界是，模型没有人类那样自然的常识检查；给它一段资料，不代表它一定正确使用。\n\n### 2. 先分开“准备资料”和“回答问题”\n\n下面是教学简图，不是任何产品的完整架构。简单系统也可能直接读取整份文件，不必具备全部步骤。\n\n```text\n准备阶段：文件 → 提取文字与结构 → 划分片段并保留来源 → 建立检索索引\n\n回答阶段：问题 → 查找候选片段 → 核对相关性与适用范围 → 根据证据回答\n                                            │\n                            证据不足 ────────┘\n                               ↓\n                  补查、澄清，或说明目前无法确定\n```\n\n为什么要分两条线？假设某段关键信息根本没有成功进入索引，反复换措辞搜索，仍可能找不到。此时需要回看资料准备阶段。不能把所有错误都归到最后写答案的模型身上。\n\n“索引”在这里先理解为帮助定位内容的目录或地图即可。它不只可以按关键词，也可以按含义建立联系；具体算法留到后面再学。\n\n### 3. 用一份虚构的活动手册走一遍\n\n假设有三份材料：\n\n- 2025 年手册：活动 8:30 开始。\n- 2026 年正式通知：活动 9:00 开始。\n- 2026 年志愿者说明：工作人员 8:00 到场。\n\n现在问：“今年我作为普通参与者，几点到？”\n\n**第一关：问题中的条件。**“今年”“普通参与者”都在限制答案。只搜索“几点”，可能同时找到三个看似相关的时间。\n\n**第二关：材料中的范围。**年份、对象、文件状态需要一起看。语义相近并不等于对当前问题适用。\n\n**第三关：证据是否足够。**“9:00 开始”不等于“9:00 到场就来得及”。如果没有签到时间，只能据实说明活动开始时间，不能凭感觉补出签到要求。\n\n**第四关：说清依据。**回答应让你看出哪些来自通知，哪些目前缺资料。如果后续发现新通知被撤销，还要回到证据选择环节，而不是继续沿旧结论生成。\n\n这说明 RAG 的价值不只是提供额外文字，而是让回答有机会建立在可检查的材料上。材料有没有覆盖你的问题、回答有没有越过证据，仍然要分别检查。\n\n### 4. 三种不同的失败，分别检查\n\n| 失败类型 | 活动手册中的表现 | 优先检查 |\n| --- | --- | --- |\n| 准备有缺漏 | 2026 年正式通知没有被正确提取 | 原文件、提取结果、索引更新 |\n| 检索选错 | 找到了旧手册，漏掉新通知 | 查询条件、候选结果、日期与对象 |\n| 生成越界 | 资料只说9点开始，却回答8点半必须签到 | 回答中的每个结论是否有依据 |\n\n遇到错误时，这张表比“换一个更强模型试试”更能帮你定位问题。更强模型可能改善某些环节，却不能凭空还原没有送达的信息。\n\n### 5. 为什么片段要带“身份”？\n\n只摘出“9:00 开始”，可能丢掉年份和对象。若连同“2026年正式通知、普通参与者活动安排、原文所在位置”保存，可核查性更好。\n\n一种已有的改进思路是在片段前补充它在原文中的背景，以帮助检索。这是 Contextual Retrieval 的核心思路之一；背景由模型生成时，也需要检查是否准确。[基础资料，2024-09-19](https://www.anthropic.com/engineering/contextual-retrieval)\n\n对你的知识库，一个轻量做法就是保留日报日期、概念主题、来源链接和适用说明。目前的 HTML 搜索是标题与正文的关键词检索，并不是完整的自动 RAG 问答系统；它让你查阅资料，不会自动根据检索结果生成答案。\n\n### 今天先记住这句话\n\n**检索到相关材料，是回答问题的起点；材料是否适用、结论是否得到支持，是另外两次检查。**\n\n打开学习台的互动图解，可以逐步查看“确认条件→找候选→核对版本→组织回答→检查支持”的链条。未通过核对时，箭头返回查找环节；实际系统也可以请求澄清或停止。\n\n可复习：[RAG与证据链](../概念/RAG与证据链.md)。下一步建议学习“上下文”：被找到的材料怎样进入模型此刻能参考的内容，以及它与长期保存的记忆有什么区别。\n\n## 三、一道可选理解题\n\n**AI 为你附了三条引用，但引用全来自去年的活动手册。它已经可靠地回答了“今年普通参与者几点到场”吗？你最想让它补查哪一项信息？**\n\n用自己的话回答一两句即可，不需要记住术语。\n\n## 四、我的笔记\n\n\u003c!-- 可在此补充问题或理解；更新时保留。 -->\n\n\n### 学习反馈补充（2026-10-19）\n\n用户提出：核对当前年份、查今年手册、缺少最新资料时明确注明，并限定普通参与者身份。能在本例应用时效性与对象检查；旧版是否仍有效及引用是否支持结论需继续核查。\n\n用户自评：资料不够完整，年份/对象/版本尚可，结论比较有依据。后续加强背景、缺失条件和证据覆盖说明。\n\n对系统概念的主动复述及纠偏见：[系统概念纠偏](../概念/系统概念纠偏-2026-10-19.md)。\n","path":"日报/2026-10-19.md","visual":{"summary":"从RAGFlow候选版本出发，用活动手册理解查找、核对与有根据的回答。","title":"找到时间之后，还要检查什么？","intro":"虚构活动手册例子。点击步骤看如何排除旧版与对象不符的资料；核对不通过时返回查找，证据仍不足可澄清或停止。","steps":[{"label":"确认问题条件","role":"年份 / 对象","detail":"今年、普通参与者、到场时间是三个条件。“几点开始”与“几点到场”可能不是同一个问题。","failure":"缺少条件时先澄清，避免自作主张。"},{"label":"查找候选片段","role":"检索","detail":"可能找出2025年手册、2026年正式通知和志愿者说明，先保留来源与日期。","failure":"关键通知没被提取或索引时，可能需要回到资料准备阶段。"},{"label":"核对版本与范围","role":"适用性检查","detail":"排除旧版和仅适用于工作人员的要求，检查新通知是否仍有效。核对不通过时返回查找。","failure":"相关词很多，也可能是错的年份或人群。"},{"label":"依据材料作答","role":"生成","detail":"只说材料支持的内容。如果通知只写9点开始，要说明尚缺签到或到场安排，不能自行补出时间。","failure":"把活动开始时间改写成必须到场时间，会越过证据。"},{"label":"检查每个结论","role":"支持关系","detail":"逐条确认引用确实支持回答。无依据时修正、补查或报告无法确定，达到预算后停止。","failure":"有链接不代表结论被支持，更不代表引用适用于今年。"}],"feedback":{"from":3,"to":2,"label":"版本或对象不符，继续查找"},"footer":"这是RAG证据核对的教学示意，不是RAGFlow内部架构。准备阶段的文件提取与索引在图外；实际系统可请求澄清或停止。"}},{"date":"2026-10-18","title":"AI 日报 001｜Agent 怎样从“回答问题”走向“持续做事”？","tags":["AI","Agent","Harness","Loop","记忆","RAG","可靠性"],"html":"\u003ch1>AI 日报 001｜Agent 怎样从“回答问题”走向“持续做事”？\u003c/h1>\n\u003cp>日期：2026 年 10 月 18 日（北京时间）\u003cbr>阅读安排：最新进展约 7 分钟，系统学习与思考约 8 分钟。\u003c/p>\n\u003cp>今天抓住一个问题：\u003cstrong>把信息存起来以后，AI 为什么仍可能在下一次任务中用错、漏用，甚至根本没用到？\u003c/strong>\u003c/p>\n\u003ch2>一、最新进展：记忆系统开始面对实际运行中的细节\u003c/h2>\n\u003cp>检索说明：本次未选出能充分核验且适合入门讲解的过去 24 小时重大技术发布，因此扩大到最近 7 天。下面是精选观察，不是全网完整清单。基础资料另行标明，不冒充当天新闻。\u003c/p>\n\u003ch3>1. Hindsight v1.0.0：关注记忆链条是否真正接通\u003c/h3>\n\u003cp>\u003cstrong>事件日期：2026-10-13。\u003c/strong> 发布记录包含长提示词下的记忆注入、首次召回为空、会话记录完整性等修复，以及 OpenClaw 原生记忆提供方集成。\u003ca href=\"https://github.com/vectorize-io/hindsight/releases/tag/v1.0.0\">官方版本记录\u003c/a>\u003c/p>\n\u003cp>Hindsight 的项目定位是 Agent 记忆系统，提供保存、召回和反思等能力。这是项目自身的设计说明；不能单凭这个定位认定它在所有任务中胜过 RAG。\u003ca href=\"https://github.com/vectorize-io/hindsight\">项目说明\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>怎么理解这些更新？\u003c/strong>\u003c/p>\n\u003cp>想象你请了一位研究助理，每次工作后都记笔记。第二天，他要先从笔记中找出相关内容，再结合新资料完成任务。这里至少存在三个不同的成功条件：笔记写进去了，相关笔记找到了，找到的笔记确实参与了这次工作。\u003c/p>\n\u003cp>这个例子是帮助理解的假设，不是对 Hindsight 内部实现的逐项描述。它说明了为什么记忆系统不能只看“能存多少”：即使前两个步骤成功，第三步仍可能出问题。\u003c/p>\n\u003cp>**我的解读：**这类修复提醒我们，评估记忆产品时，应同时考察整条使用链是否可靠。给你的日报加上一个“学习进度.md”，只是创造了可读取的记录；只有后续运行实际读取它、辨认其中的反馈，并据此调整内容，才对学习产生帮助。\u003c/p>\n\u003cp>**证据边界：**发布记录能支持“维护者公布了哪些改动”，不能证明修复后每种场景都稳定，也没有提供这些改动带来的统一效果提升数字。版本号到 1.0，不等于全部问题都解决。\u003c/p>\n\u003cp>如果以后想试用同类产品，可以用一个很小的任务检查：今天明确告诉它“我不写代码”，隔天换一个主题，看它是否仍然避免用代码作为理解前提。还要检查它有没有把某次临时偏好误当成永久规则。这是我们提出的评估思路，不是已完成的实验。\u003c/p>\n\u003ch3>2. Anthropic 的新报告：Agent 多了，人该看什么成为问题\u003c/h3>\n\u003cp>\u003cstrong>发布日期：2026-10-16。\u003c/strong> Anthropic 对内部 AI 使用与工作变化的研究指出，随着 Agent 输出增加，人的注意力成为瓶颈，员工开始建设监督流程与可视化工具。\u003ca href=\"https://www.anthropic.com/research/employment-at-anthropic\">原始报告\u003c/a>\u003c/p>\n\u003cp>**证据边界：**这是单一公司的内部观察，采用工具也不是随机分配，不能直接推导出各行业的因果效果。\u003c/p>\n\u003cp>**对我们的启发：**假设一个系统每天找到 100 篇文章，又生成 100 份摘要，你仍要逐条判断哪些可信、哪些重复、哪些与你有关，工作可能只是换了位置。我们的日报应承担筛选与解释，并把来源留给你核查，而不是把筛选工作重新交回给你。\u003c/p>\n\u003cp>判断日报效果时，可以关注三个具体结果：读完后，你能否说清一个新机制；能否区分事实与推断；是否知道什么还不确定。文章数量不直接等于学习价值。\u003c/p>\n\u003ch3>今天值得持续追踪的技术问题\u003c/h3>\n\u003cp>这两项材料给出了一条值得继续观察的线索：**随着 Agent 能执行更多步骤，怎样保存可靠状态、把相关信息送到正确步骤、让人及时发现异常，变得越来越关键。**这是本期的综合判断，不是已经被两项材料证明的行业定律。\u003c/p>\n\u003cp>未来报道记忆、Harness 或多 Agent 新项目时，我们会沿这条线追问：它具体改善了哪个环节？用什么任务验证？失败了怎么办？\u003c/p>\n\u003ch2>二、系统学习第一课：把五个词放回同一个任务\u003c/h2>\n\u003ch3>先从你的日报出发\u003c/h3>\n\u003cp>你给出的目标包含很多条件：每天追踪变化、适合当前基础、避免重复、保存文件、根据反馈调整。完成它，需要一连串动作，以及对动作结果的检查。\u003c/p>\n\u003cp>下面的表是入门工作定义。行业对这些词的边界并不完全一致，暂时理解各自负责什么，比背定义更有用。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>词\u003c/th>\n\u003cth>它主要回答什么问题？\u003c/th>\n\u003cth>用日报举例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模型\u003c/td>\n\u003ctd>怎样理解信息、形成判断、生成内容？\u003c/td>\n\u003ctd>读资料、解释概念、写文章\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>怎样围绕目标选择动作并继续推进？\u003c/td>\n\u003ctd>发现来源日期不明，再查原始发布记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loop（循环）\u003c/td>\n\u003ctd>做完一步后，怎样根据结果决定下一步？\u003c/td>\n\u003ctd>搜索→查看→判断证据不足→补查\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness（运行支撑）\u003c/td>\n\u003ctd>怎样让这些动作实际运行，并管理状态与限制？\u003c/td>\n\u003ctd>连接工具、组织调用、记录结果、处理失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG（检索增强生成）\u003c/td>\n\u003ctd>怎样先找到外部资料，再据此生成回答？\u003c/td>\n\u003ctd>从旧日报中找出已经讲过的概念\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>记忆\u003c/td>\n\u003ctd>哪些过去的信息值得保留，何时再使用？\u003c/td>\n\u003ctd>保留你的偏好、明确反馈与学习进度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Agent 与固定工作流有重叠：固定工作流预先规定步骤，Agent 通常能依据反馈选择后续动作；现实系统经常混用两者。相关架构区分可参考 \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\">Anthropic 的基础文章，2024-12-19\u003c/a>。这是一份基础阅读，不是本周新闻。\u003c/p>\n\u003ch3>Loop：关键在于结果能改变下一步\u003c/h3>\n\u003cp>假设搜索结果说“某项目发布了新功能”。一个有用的循环可以这样走：\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">目标：解释一项值得学习的新进展\n  ↓\n查找候选资料\n  ↓\n阅读原始来源\n  ↓\n判断：日期、改动、证据是否清楚？\n  ├─ 不清楚 → 补查，或舍弃这条候选\n  └─ 清楚 → 写成解释 → 检查并保存 → 结束\n\u003c/code>\u003c/pre>\n\u003cp>这里“再查一次”的原因是发现信息不足。只是每天定时重复写文章，也是一种重复，但不是这里讨论的任务内部反馈循环。\u003c/p>\n\u003cp>循环还需要结束条件。资料可能永远查不完，因此日报需要阅读预算、时间范围和证据门槛：证据不足时标明不确定或舍弃，不能为了填满篇幅无限搜索。\u003c/p>\n\u003ch3>Harness：把思考接到行动上\u003c/h3>\n\u003cp>可以把模型比作一位能理解任务的助理，把 Harness 比作让这位助理开展工作的工作台：有可用工具、有任务记录、有操作边界，也能把执行结果反馈回来。\u003c/p>\n\u003cp>这只是类比。软件系统不会像人一样自然记得所有经历；工具失败时，也需要明确处理。\u003c/p>\n\u003cp>一个实际架构例子是 Anthropic 在 2026 年 4 月介绍的设计：将模型与 Harness、执行工具的环境、会话事件记录拆开，使部分组件失败后能够独立恢复。这个例子帮助理解运行支撑的作用，不代表所有 Harness 都采用同一结构。\u003ca href=\"https://www.anthropic.com/engineering/managed-agents\">工程说明，2026-04-08\u003c/a>\u003c/p>\n\u003ch3>RAG 与记忆：会合作，也各有问题\u003c/h3>\n\u003cp>今天先用“查资料”理解 RAG：回答前，从外部资料中找出相关片段，再交给模型参考。它能减少只凭模型已有知识回答的情况，但检索可能漏掉关键内容，资料可能过时，生成时也可能误读。\u003c/p>\n\u003cp>记忆关注的是另一组问题：过去发生了什么，哪些内容应该保留，哪些需要更新，下一次什么时候使用。记忆系统也可以用检索，所以它们不是互斥的两个盒子。\u003c/p>\n\u003cp>用你的知识库举例：\u003c/p>\n\u003cul>\n\u003cli>日报文件保存了历史内容。\u003c/li>\n\u003cli>检索这些文件，可以帮助找到过去讲过的 RAG。\u003c/li>\n\u003cli>学习进度记录“讲过 RAG，但尚未收到理解反馈”。\u003c/li>\n\u003cli>下次生成时，系统据此安排一句回顾或一道小问题。\u003c/li>\n\u003c/ul>\n\u003cp>最后两步需要对记录作出解释。文件存在，并不会自动带来适合你的教学。\u003c/p>\n\u003cp>本期也没有安装 Hindsight。我们先用 Markdown 记录实现简单、可查看的学习连续性，以后再判断是否需要更复杂的记忆工具。\u003c/p>\n\u003ch3>接下来的学习路线\u003c/h3>\n\u003col>\n\u003cli>先学外部资料如何进入回答：RAG、检索与来源核查。\u003c/li>\n\u003cli>再学哪些信息能保留到下次：上下文、记忆与更新。\u003c/li>\n\u003cli>深入执行：Loop、停止条件、工具失败与 Harness。\u003c/li>\n\u003cli>学会判断效果：评测、对照实验、失败样例。\u003c/li>\n\u003cli>在以上基础上理解多 Agent 协作与反思机制。\u003c/li>\n\u003c/ol>\n\u003cp>这是起始路线，会随你的回答和重要进展调整。今天只要求你先认出这些角色，不要求一次掌握所有术语。可复习 \u003ca href=\"../%E6%A6%82%E5%BF%B5/Agent%E7%B3%BB%E7%BB%9F%E6%A6%82%E5%BF%B5%E5%9C%B0%E5%9B%BE.md\">概念地图\u003c/a>。\u003c/p>\n\u003ch2>三、一道可选理解题\u003c/h2>\n\u003cp>\u003cstrong>假设明天的日报忘了“你基本不写代码”，整篇都在讲代码。除了“模型能力不够”，你能想到一个可能出问题的环节吗？你会先检查什么？\u003c/strong>\u003c/p>\n\u003cp>用生活语言回答一两句即可；没有唯一答案，也不要求使用今天的术语。\u003c/p>\n\u003ch2>四、我的笔记\u003c/h2>\n","text":"---\ndate: 2026-10-18\ntimezone: Asia/Shanghai\nissue: 1\ntags: [AI, Agent, Harness, Loop, 记忆, RAG, 可靠性]\nlevel: 入门\nstatus: 首次手动试运行\n---\n\n# AI 日报 001｜Agent 怎样从“回答问题”走向“持续做事”？\n\n日期：2026 年 10 月 18 日（北京时间）  \n阅读安排：最新进展约 7 分钟，系统学习与思考约 8 分钟。\n\n今天抓住一个问题：**把信息存起来以后，AI 为什么仍可能在下一次任务中用错、漏用，甚至根本没用到？**\n\n## 一、最新进展：记忆系统开始面对实际运行中的细节\n\n检索说明：本次未选出能充分核验且适合入门讲解的过去 24 小时重大技术发布，因此扩大到最近 7 天。下面是精选观察，不是全网完整清单。基础资料另行标明，不冒充当天新闻。\n\n### 1. Hindsight v1.0.0：关注记忆链条是否真正接通\n\n**事件日期：2026-10-13。** 发布记录包含长提示词下的记忆注入、首次召回为空、会话记录完整性等修复，以及 OpenClaw 原生记忆提供方集成。[官方版本记录](https://github.com/vectorize-io/hindsight/releases/tag/v1.0.0)\n\nHindsight 的项目定位是 Agent 记忆系统，提供保存、召回和反思等能力。这是项目自身的设计说明；不能单凭这个定位认定它在所有任务中胜过 RAG。[项目说明](https://github.com/vectorize-io/hindsight)\n\n**怎么理解这些更新？**\n\n想象你请了一位研究助理，每次工作后都记笔记。第二天，他要先从笔记中找出相关内容，再结合新资料完成任务。这里至少存在三个不同的成功条件：笔记写进去了，相关笔记找到了，找到的笔记确实参与了这次工作。\n\n这个例子是帮助理解的假设，不是对 Hindsight 内部实现的逐项描述。它说明了为什么记忆系统不能只看“能存多少”：即使前两个步骤成功，第三步仍可能出问题。\n\n**我的解读：**这类修复提醒我们，评估记忆产品时，应同时考察整条使用链是否可靠。给你的日报加上一个“学习进度.md”，只是创造了可读取的记录；只有后续运行实际读取它、辨认其中的反馈，并据此调整内容，才对学习产生帮助。\n\n**证据边界：**发布记录能支持“维护者公布了哪些改动”，不能证明修复后每种场景都稳定，也没有提供这些改动带来的统一效果提升数字。版本号到 1.0，不等于全部问题都解决。\n\n如果以后想试用同类产品，可以用一个很小的任务检查：今天明确告诉它“我不写代码”，隔天换一个主题，看它是否仍然避免用代码作为理解前提。还要检查它有没有把某次临时偏好误当成永久规则。这是我们提出的评估思路，不是已完成的实验。\n\n### 2. Anthropic 的新报告：Agent 多了，人该看什么成为问题\n\n**发布日期：2026-10-16。** Anthropic 对内部 AI 使用与工作变化的研究指出，随着 Agent 输出增加，人的注意力成为瓶颈，员工开始建设监督流程与可视化工具。[原始报告](https://www.anthropic.com/research/employment-at-anthropic)\n\n**证据边界：**这是单一公司的内部观察，采用工具也不是随机分配，不能直接推导出各行业的因果效果。\n\n**对我们的启发：**假设一个系统每天找到 100 篇文章，又生成 100 份摘要，你仍要逐条判断哪些可信、哪些重复、哪些与你有关，工作可能只是换了位置。我们的日报应承担筛选与解释，并把来源留给你核查，而不是把筛选工作重新交回给你。\n\n判断日报效果时，可以关注三个具体结果：读完后，你能否说清一个新机制；能否区分事实与推断；是否知道什么还不确定。文章数量不直接等于学习价值。\n\n### 今天值得持续追踪的技术问题\n\n这两项材料给出了一条值得继续观察的线索：**随着 Agent 能执行更多步骤，怎样保存可靠状态、把相关信息送到正确步骤、让人及时发现异常，变得越来越关键。**这是本期的综合判断，不是已经被两项材料证明的行业定律。\n\n未来报道记忆、Harness 或多 Agent 新项目时，我们会沿这条线追问：它具体改善了哪个环节？用什么任务验证？失败了怎么办？\n\n## 二、系统学习第一课：把五个词放回同一个任务\n\n### 先从你的日报出发\n\n你给出的目标包含很多条件：每天追踪变化、适合当前基础、避免重复、保存文件、根据反馈调整。完成它，需要一连串动作，以及对动作结果的检查。\n\n下面的表是入门工作定义。行业对这些词的边界并不完全一致，暂时理解各自负责什么，比背定义更有用。\n\n| 词 | 它主要回答什么问题？ | 用日报举例 |\n| --- | --- | --- |\n| 模型 | 怎样理解信息、形成判断、生成内容？ | 读资料、解释概念、写文章 |\n| Agent | 怎样围绕目标选择动作并继续推进？ | 发现来源日期不明，再查原始发布记录 |\n| Loop（循环） | 做完一步后，怎样根据结果决定下一步？ | 搜索→查看→判断证据不足→补查 |\n| Harness（运行支撑） | 怎样让这些动作实际运行，并管理状态与限制？ | 连接工具、组织调用、记录结果、处理失败 |\n| RAG（检索增强生成） | 怎样先找到外部资料，再据此生成回答？ | 从旧日报中找出已经讲过的概念 |\n| 记忆 | 哪些过去的信息值得保留，何时再使用？ | 保留你的偏好、明确反馈与学习进度 |\n\nAgent 与固定工作流有重叠：固定工作流预先规定步骤，Agent 通常能依据反馈选择后续动作；现实系统经常混用两者。相关架构区分可参考 [Anthropic 的基础文章，2024-12-19](https://www.anthropic.com/engineering/building-effective-agents)。这是一份基础阅读，不是本周新闻。\n\n### Loop：关键在于结果能改变下一步\n\n假设搜索结果说“某项目发布了新功能”。一个有用的循环可以这样走：\n\n```text\n目标：解释一项值得学习的新进展\n  ↓\n查找候选资料\n  ↓\n阅读原始来源\n  ↓\n判断：日期、改动、证据是否清楚？\n  ├─ 不清楚 → 补查，或舍弃这条候选\n  └─ 清楚 → 写成解释 → 检查并保存 → 结束\n```\n\n这里“再查一次”的原因是发现信息不足。只是每天定时重复写文章，也是一种重复，但不是这里讨论的任务内部反馈循环。\n\n循环还需要结束条件。资料可能永远查不完，因此日报需要阅读预算、时间范围和证据门槛：证据不足时标明不确定或舍弃，不能为了填满篇幅无限搜索。\n\n### Harness：把思考接到行动上\n\n可以把模型比作一位能理解任务的助理，把 Harness 比作让这位助理开展工作的工作台：有可用工具、有任务记录、有操作边界，也能把执行结果反馈回来。\n\n这只是类比。软件系统不会像人一样自然记得所有经历；工具失败时，也需要明确处理。\n\n一个实际架构例子是 Anthropic 在 2026 年 4 月介绍的设计：将模型与 Harness、执行工具的环境、会话事件记录拆开，使部分组件失败后能够独立恢复。这个例子帮助理解运行支撑的作用，不代表所有 Harness 都采用同一结构。[工程说明，2026-04-08](https://www.anthropic.com/engineering/managed-agents)\n\n### RAG 与记忆：会合作，也各有问题\n\n今天先用“查资料”理解 RAG：回答前，从外部资料中找出相关片段，再交给模型参考。它能减少只凭模型已有知识回答的情况，但检索可能漏掉关键内容，资料可能过时，生成时也可能误读。\n\n记忆关注的是另一组问题：过去发生了什么，哪些内容应该保留，哪些需要更新，下一次什么时候使用。记忆系统也可以用检索，所以它们不是互斥的两个盒子。\n\n用你的知识库举例：\n\n- 日报文件保存了历史内容。\n- 检索这些文件，可以帮助找到过去讲过的 RAG。\n- 学习进度记录“讲过 RAG，但尚未收到理解反馈”。\n- 下次生成时，系统据此安排一句回顾或一道小问题。\n\n最后两步需要对记录作出解释。文件存在，并不会自动带来适合你的教学。\n\n本期也没有安装 Hindsight。我们先用 Markdown 记录实现简单、可查看的学习连续性，以后再判断是否需要更复杂的记忆工具。\n\n### 接下来的学习路线\n\n1. 先学外部资料如何进入回答：RAG、检索与来源核查。\n2. 再学哪些信息能保留到下次：上下文、记忆与更新。\n3. 深入执行：Loop、停止条件、工具失败与 Harness。\n4. 学会判断效果：评测、对照实验、失败样例。\n5. 在以上基础上理解多 Agent 协作与反思机制。\n\n这是起始路线，会随你的回答和重要进展调整。今天只要求你先认出这些角色，不要求一次掌握所有术语。可复习 [概念地图](../概念/Agent系统概念地图.md)。\n\n## 三、一道可选理解题\n\n**假设明天的日报忘了“你基本不写代码”，整篇都在讲代码。除了“模型能力不够”，你能想到一个可能出问题的环节吗？你会先检查什么？**\n\n用生活语言回答一两句即可；没有唯一答案，也不要求使用今天的术语。\n\n## 四、我的笔记\n\n\u003c!-- 可以在下面补充问题、理解或偏好；后续更新请保留。 -->\n\n","path":"日报/2026-10-18.md","visual":{"summary":"从 Hindsight 的记忆更新出发，理解 Agent 持续做事所需的工具、循环与运行支撑。","title":"一份日报，是怎样完成的？","intro":"点击任一步骤，看它做什么、可能在哪里出错。箭头表示任务推进；证据不足时，会回到查找环节。","steps":[{"label":"读取学习记录","role":"记忆","detail":"先看你不写代码、每天约15分钟等偏好，以及哪些内容讲过、哪些得到理解反馈。记录存在还不够，必须在任务中实际读取。","failure":"可能出错：遗漏记录，或把“讲过”误认为“已经掌握”。"},{"label":"找出相关资料","role":"检索 / RAG","detail":"从外部资料和既有笔记中找到与任务相关的内容，再交给模型参考。RAG指检索辅助生成，不保证找到的资料一定完整、正确。","failure":"可能出错：来源过时、关键资料漏检、只看到转述。"},{"label":"核验与补查","role":"Loop","detail":"观察检索结果，判断日期、证据是否足够。不足时补查或舍弃候选，满足条件后继续。反馈决定下一步，循环需要停止条件。","failure":"可能出错：没有检查便继续，或不断补查却无法结束。"},{"label":"解释并归档","role":"模型 + 工具","detail":"模型组织解释，文件工具保存Markdown；生成器将长期资料汇总进HTML。保存后检查文件与链接。","failure":"可能出错：文字说已保存，文件实际没有写入。"},{"label":"根据反馈调整","role":"学习连续性","detail":"你在聊天中的回答会帮助后续日报调整深度。未回答时，继续学习，但不据此认定已经掌握。","failure":"可能出错：只按天数加难度，没有参考真实反馈。"}],"footer":"Harness 为整条流程连接模型、工具、状态与执行规则。这个图是你的日报的教学示意，不是 Hindsight 的内部架构图。","feedback":{"from":3,"to":2,"label":"证据不足，返回查找资料"}}}],"concepts":[{"title":"Agent 系统概念地图","html":"\u003ch1>Agent 系统概念地图\u003c/h1>\n\u003cp>首次介绍：2026-10-18。状态：已介绍，尚未通过反馈确认理解。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>入门解释\u003c/th>\n\u003cth>主要边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>模型\u003c/td>\n\u003ctd>理解信息并生成判断或内容的组件\u003c/td>\n\u003ctd>不等于完整的任务执行系统\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>围绕目标、依据反馈选择动作的系统\u003c/td>\n\u003ctd>自主程度不同，经常与固定工作流混用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loop\u003c/td>\n\u003ctd>行动后观察结果，再决定继续、改变动作或结束\u003c/td>\n\u003ctd>单纯定时重复不等于任务内反馈循环\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness\u003c/td>\n\u003ctd>连接模型、工具、状态与执行规则的运行支撑\u003c/td>\n\u003ctd>不同产品对范围的定义不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG\u003c/td>\n\u003ctd>先检索外部资料，再辅助生成\u003c/td>\n\u003ctd>检索、资料与解读仍可能出错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>记忆\u003c/td>\n\u003ctd>保留、更新和使用过去信息的机制\u003c/td>\n\u003ctd>保存文件不代表下次一定读取或正确使用；可与检索结合\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>例子：日报先读取学习进度，检索来源，发现不足后补查，完成后保存文件并更新进度。\u003c/p>\n\u003cp>来源：\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\">Agent 与工作流\u003c/a>、\u003ca href=\"https://www.anthropic.com/engineering/managed-agents\">运行架构\u003c/a>、\u003ca href=\"https://github.com/vectorize-io/hindsight\">记忆项目示例\u003c/a>。\u003c/p>\n\u003cp>相关日报：\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-18.md\">第一期\u003c/a>。\u003c/p>\n","path":"概念/Agent系统概念地图.md"},{"title":"RAG与证据链","html":"\u003ch1>RAG与证据链\u003c/h1>\n\u003cp>首次介绍：2026-10-19。状态：已介绍，待用户反馈；不是已确认掌握。\u003c/p>\n\u003cp>RAG（检索增强生成）：先检索外部资料，再让模型参考资料生成回答。它不自动保证资料适用或结论正确。\u003c/p>\n\u003cp>教学例子：2025年手册、2026年通知和志愿者说明可能包含不同时间。回答普通参与者的问题时，应同时核对年份、对象和通知状态；活动开始时间也不自动等于签到截止时间。\u003c/p>\n\u003ch2>三次检查\u003c/h2>\n\u003col>\n\u003cli>准备：关键资料是否正确提取并进入索引？\u003c/li>\n\u003cli>检索：候选片段是否符合问题的时间、对象及范围？\u003c/li>\n\u003cli>生成：每个结论是否得到材料支持？没有依据时补查、澄清或说明不确定。\u003c/li>\n\u003c/ol>\n\u003cp>来源：\u003ca href=\"https://arxiv.org/abs/2005.11401\">RAG经典论文\u003c/a>、\u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\">Contextual Retrieval基础资料\u003c/a>。\u003c/p>\n\u003cp>相关日报：\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-19.md\">2026-10-19\u003c/a>；前置：\u003ca href=\"Agent%E7%B3%BB%E7%BB%9F%E6%A6%82%E5%BF%B5%E5%9C%B0%E5%9B%BE.md\">Agent系统概念地图\u003c/a>。\u003c/p>\n","path":"概念/RAG与证据链.md"},{"title":"摘要、条件与原文回查","html":"\u003ch1>摘要、条件与原文回查\u003c/h1>\n\u003cp>首次介绍：2026-10-21。状态：已介绍，等待用户反馈。\u003c/p>\n\u003cp>摘要是有取舍的信息表示，不保证保留后来任务需要的全部细节。对象、例外、有效期等条件一旦丢失，局部结论可能被误用为普遍结论。\u003c/p>\n\u003cp>例子（虚构）：普通学员非雨天9点东门、雨天9点北门；已登记志愿者8点西门。压成“活动9点东门”会丢失对象与天气分支。\u003c/p>\n\u003cp>可复用记录：对象、条件、结论、来源定位、未确定事项。面对摘要未覆盖的条件、版本疑问或冲突，应回读适用原文；无法取得时说明缺口，不能猜成已确认事实。\u003c/p>\n\u003cp>边界：保存来源不保证自动回查；读到不保证完整传入；传入不保证正确使用；扩大窗口不自动恢复已删信息。摘要不必全文复制，关键在本次任务所需约束与回查能力。\u003c/p>\n\u003cp>来源：\u003ca href=\"https://www.anthropic.com/research/effective-context-engineering-for-ai-agents\">Anthropic上下文工程，2025-09-29\u003c/a>。近期实例：\u003ca href=\"https://octomind.run/blog/octomind-0-58-5-release\">Octomind官方说明，2026-10-17\u003c/a>，未独立复现。\u003c/p>\n\u003cp>相关日报：\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-21.md\">2026-10-21\u003c/a>、\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-20.md\">2026-10-20\u003c/a>。\u003c/p>\n","path":"概念/摘要-条件与原文回查.md"},{"title":"系统概念纠偏：预测、推理与执行","html":"\u003ch1>系统概念纠偏：预测、推理与执行\u003c/h1>\n\u003cp>日期：2026-10-19。依据用户主动复述整理；本次已说明，尚未确认掌握。此笔记为课程反馈补充，不是新一期日报。\u003c/p>\n\u003ch2>活动手册题\u003c/h2>\n\u003cp>已表现：能主动查时效性、限定身份、识别查不到新版时需披露。进一步区分：旧文件不必然无效，最新发布也未必已经生效；应核对当前适用版本、活动届次、勘误和权威出处。可靠系统时间可作为当前日期依据，不必每次都联网校时。\u003c/p>\n\u003ch2>各组件的工作定义\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>更准确的理解\u003c/th>\n\u003cth>需要避免的等同\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>LLM\u003c/td>\n\u003ctd>常见自回归模型将上下文变成数值表示，经神经网络计算后生成下一token的分布；可以学到并执行推理模式，但会出错\u003c/td>\n\u003ctd>反向扩散追溯元语义；预测就没有推理；高概率就是高真实性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prompt\u003c/td>\n\u003ctd>提供目标、材料、例子、约束与输出要求，改变这次生成的条件\u003c/td>\n\u003ctd>临时修改模型权重或给出精确的向量方向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Skills\u003c/td>\n\u003ctd>可按需加载的任务指令与资源包，可含脚本、示例和参考文件\u003c/td>\n\u003ctd>只要保存Markdown就成为会自动执行的技能；新的向量标准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RAG\u003c/td>\n\u003ctd>检索外部资料并辅助生成\u003c/td>\n\u003ctd>所有记忆或永久学会知识\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MCP\u003c/td>\n\u003ctd>让应用与外部服务交换工具及上下文的连接协议\u003c/td>\n\u003ctd>工具本体、浏览器本体、全部Agent都必须使用的机制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agent\u003c/td>\n\u003ctd>围绕目标依据反馈选择动作并推进任务的系统\u003c/td>\n\u003ctd>只负责管理文字输出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Harness\u003c/td>\n\u003ctd>运行Agent的支撑：组织上下文、调用工具、管理状态、边界和结束条件\u003c/td>\n\u003ctd>必定在Agent之外的上级治理层；只改善输出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loop\u003c/td>\n\u003ctd>行动→观察反馈→决定继续、重试或结束\u003c/td>\n\u003ctd>必须源自CoT；每轮自评就保证越来越正确\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CoT\u003c/td>\n\u003ctd>将问题分解为中间推理步骤的一类方法\u003c/td>\n\u003ctd>外部验证机制；可见解释必然完整还原内部过程\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>同一个例子\u003c/h2>\n\u003cp>要知道今年活动到场时间：模型分析问题；Prompt明确身份与年份；Skills可规定查证步骤；RAG找出手册片段；工具实际访问网页，可能经MCP连接；Agent决定下一步查什么；Harness传递结果、管理状态与限制；Loop在发现版本不符后补查。CoT可以帮助分解问题，但能否核实结论仍取决于证据与检查方法。\u003c/p>\n\u003cp>这是帮助区分职责的教学地图，不是所有产品都按此拆成独立模块。\u003c/p>\n\u003cp>来源：\u003ca href=\"https://arxiv.org/abs/1706.03762\">Transformer论文\u003c/a>、\u003ca href=\"https://arxiv.org/abs/2201.11903\">CoT论文\u003c/a>、\u003ca href=\"https://developers.openai.com/api/docs/guides/reasoning-best-practices\">推理模型说明\u003c/a>、\u003ca href=\"https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills\">Agent Skills\u003c/a>、\u003ca href=\"https://modelcontextprotocol.io/docs/learn/architecture\">MCP架构\u003c/a>、\u003ca href=\"https://www.anthropic.com/engineering/managed-agents\">Harness与执行环境\u003c/a>。\u003c/p>\n\u003cp>相关：\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-18.md\">第一期\u003c/a>、\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-19.md\">第二期\u003c/a>。\u003c/p>\n\u003ch2>后续理解反馈\u003c/h2>\n\u003cp>用户已能区分模型形成结果与计算器外部核验。补充：调用工具与发现错误属于循环中的行动、观察环节，还要依据反馈决定修正、重试或停止。示例：模型算出17 → 计算器返回19 → 比较发现不一致 → 检查步骤并修正或继续验证 → 满足条件后结束。不能将单次工具调用本身等同于完整Loop。\u003c/p>\n","path":"概念/系统概念纠偏-2026-10-19.md"},{"title":"预测、上下文与长期记录","html":"\u003ch1>预测、上下文与长期记录\u003c/h1>\n\u003cp>首次介绍：2026-10-20。状态：已说明，待用户反馈。\u003c/p>\n\u003cul>\n\u003cli>token预测描述常见自回归模型的生成机制；不能据此否定模型在任务中执行推理的能力。能力需要通过变化条件的任务测试，单个答案不能证明稳定掌握。\u003c/li>\n\u003cli>Prompt提供本次的目标、条件和材料，通常不直接更新模型参数。\u003c/li>\n\u003cli>上下文是本次生成可参考的输入；窗口是容量边界，不是全部长期知识。\u003c/li>\n\u003cli>文件中保存的信息，需要实际被读取或检索并加入本次任务，才能成为可参考的材料。大窗口不自动读取硬盘。\u003c/li>\n\u003cli>摘要会取舍，原文可回查不代表一定会回查；须检查关键条件与来源路径。\u003c/li>\n\u003c/ul>\n\u003cp>教学类比：工作桌是当前材料，档案柜是存储；柜中有不等于桌上有，桌上有不保证一定正确使用。不是人脑机制说明。\u003c/p>\n\u003cp>来源：\u003ca href=\"https://arxiv.org/abs/2005.14165\">GPT-3论文\u003c/a>、\u003ca href=\"https://arxiv.org/abs/2201.11903\">CoT论文\u003c/a>、\u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\">上下文工程\u003c/a>。\u003c/p>\n\u003cp>相关日报：\u003ca href=\"../%E6%97%A5%E6%8A%A5/2026-10-20.md\">2026-10-20\u003c/a>。\u003c/p>\n\u003ch2>用户反馈后的三层排查（2026-10-20）\u003c/h2>\n\u003col>\n\u003cli>获取：文件是否存在、路径权限是否正确，是否实际执行读取？\u003c/li>\n\u003cli>传入：读到的关键内容是否进入当前调用，是否被截断或摘要遗漏？\u003c/li>\n\u003cli>使用：模型是否正确应用内容，回答是否符合材料与任务条件？\u003c/li>\n\u003c/ol>\n\u003cp>验收要求可以规定“必须读取并核查”，但指令不是执行证据。读取成功也不等于答案已验证；验证方法应贴合任务，不必每次调用外部工具。发现缺少关键资料时，可停止、澄清或明确限制，避免继续无依据生成。\u003c/p>\n","path":"概念/预测-上下文与长期记录.md"}],"roadmap":[{"title":"系统地图","description":"模型、Agent、Harness、Loop、RAG 与记忆","status":"生成机制已澄清 · 待反馈"},{"title":"外部知识怎样进入回答","description":"检索、来源核查与 RAG","status":"时效与对象可应用 · 待深化"},{"title":"经验怎样留下来","description":"上下文、条件化摘要、来源回查与长期记忆","status":"信息路径可应用 · 摘要待反馈"},{"title":"任务怎样持续推进","description":"执行循环、工具失败与停止条件","status":"已能区分核验 · 待深化"},{"title":"怎样判断真的有效","description":"评测、对照实验与失败样例","status":"后续方向"},{"title":"多个 Agent 怎样协作","description":"分工、沟通成本与反思机制","status":"后续方向"}],"progress":"\u003ch1>学习进度\u003c/h1>\n\u003ch2>当前起点\u003c/h2>\n\u003cul>\n\u003cli>AI 基础阶段，基本不写代码；以生活例子、图解和类比理解技术。\u003c/li>\n\u003cli>目标：深入理解技术，其次把握方向、找到工具、发现机会。\u003c/li>\n\u003cli>每天约 15 分钟：一半最新进展，一半系统学习。\u003c/li>\n\u003cli>覆盖 AI、Agent、Harness、RAG、Loop；不预先限制方向。\u003c/li>\n\u003cli>每天一道可选理解题，根据实际回答调整深度。\u003c/li>\n\u003c/ul>\n\u003ch2>已介绍与掌握情况\u003c/h2>\n\u003cp>2026-10-18：已交付第一期试运行，介绍模型、Agent、Loop、Harness、RAG、记忆的入门区别。全部仅标记为已介绍；尚无理解题回答，未确认掌握。\u003c/p>\n\u003cp>理解题：日报忘记用户不写代码的偏好，可能在哪个环节出错，应先检查什么？\u003c/p>\n\u003cp>已报道：Hindsight v1.0.0（10月13日）、Anthropic 内部工作变化报告（10月16日）。后续无实质新进展时不要重复作为新闻。\u003c/p>\n\u003ch2>后续路线\u003c/h2>\n\u003cp>下一期建议：上下文与长期记忆的区别，先讲模型本次能参考什么。之后继续 Loop、Harness、评测与多Agent协作，按反馈调整。\u003c/p>\n\u003ch2>2026-10-19：第二期\u003c/h2>\n\u003cp>已介绍RAG、资料准备与回答两个阶段、检索适用性和结论支持的区别。尚未收到理解题反馈，以上均未确认掌握。\u003c/p>\n\u003cp>今日理解题：三个引用都来自去年手册，是否能回答今年到场时间？还需补查什么？\u003c/p>\n\u003cp>新报道：RAGFlow v1.0.0-rc2，2026-10-16；未复测其效果。2024年的Contextual Retrieval与2020年的RAG论文仅为基础资料。\u003c/p>\n\u003ch2>2026-10-19：用户反馈与课程调整\u003c/h2>\n\u003cp>用户已回答第二期理解题：先确认当前时间与活动年份，再查今年的官方手册；找不到应明确注明；必须结合手册限定参与者身份。显示已能主动识别时效性、适用对象和缺证据时的披露要求，暂记为“能在本例应用”，不推断已全面掌握RAG。\u003c/p>\n\u003cp>需补充：旧文件不必然失效；最新发布不一定当前生效，应核对生效日、活动届次、勘误及权威性。确认当前日期可使用可靠系统时间，联网校时不是每次必须。引用来自同一旧手册不等于多份独立证据；须检查引用是否支持结论。\u003c/p>\n\u003cp>用户自评：资料感觉不完整；年份、对象、版本方面尚可；结论比较有依据。后续日报加强背景、关键缺失、适用条件和来源覆盖的说明，不靠增加条目凑完整。\u003c/p>\n\u003cp>用户主动提出系统模型：用矩阵与向量解释LLM，将其联系扩散/元语义；把Prompt、Skills、RAG、MCP、Agent、Harness、Loop组成层级。能主动建立整体联系，但下列边界需要校正，不应记为已掌握：\u003c/p>\n\u003cul>\n\u003cli>常见自回归语言模型不是通过反向扩散追溯元语义；token预测机制并不排除推理能力。\u003c/li>\n\u003cli>Prompt不改变模型权重；Skills是可按需使用的指令与资源包，不只是长期Markdown或向量标准。\u003c/li>\n\u003cli>RAG是检索辅助生成机制，不能直接等同于记忆；MCP是连接协议，不是工具本体。\u003c/li>\n\u003cli>Agent依目标选择动作；Harness是其运行支撑，不是一定在Agent之上的治理层，同时影响输入、工具、状态和输出。\u003c/li>\n\u003cli>Loop是行动、观察、决定的控制循环，不是CoT延伸的必要结果；外部证据和执行结果可提供反馈，模型自评不保证正确。\u003c/li>\n\u003c/ul>\n\u003cp>后续优先路线：先澄清“token预测与推理”“Prompt改变输入而非权重”，再解释上下文、RAG与长期记忆的区别，以及Loop与CoT。结合具体例子，不因用户已使用术语就跳到实现难度。\u003c/p>\n\u003cp>本次纠偏笔记见：概念/系统概念纠偏-2026-10-19.md。纠偏已提供，仍待用户确认理解。\u003c/p>\n\u003ch2>2026-10-19：推理与Loop的第二次反馈\u003c/h2>\n\u003cp>用户回答：“计算是推理，调用计算器验证并发现错误是loop。”已能在本例区分形成答案与外部工具核验。进一步说明：模型依据步骤计算可属于推理；计算器执行运算不必视为LLM推理；调用、观察错误是Loop中的行动与反馈，完整控制循环还包括据此修正、重算、继续或停止。暂记“本例基本区分，反馈后决策待巩固”，不泛化为已掌握全部推理机制。\u003c/p>\n\u003ch2>2026-10-20：第三期\u003c/h2>\n\u003cp>已结合用户昨日反馈澄清：token预测与推理可以并存；Prompt通常改变当前条件而非权重；上下文与长期记录需要通过读取连接。用户已能在算术例子区分模型处理与外部核验，但不推断已全面掌握。今日新内容待反馈。\u003c/p>\n\u003cp>新报道：LangChain《Context Engineering: How Deep Agents Remember》，2026-10-14官方工程解读，非当天首次发布全部机制；未复现，不作为统一效果证明。\u003c/p>\n\u003cp>今日理解题：偏好存入文件但未读，大窗口能否自动解决？先查哪里？\u003c/p>\n\u003cp>最新后续建议：以摘要遗漏例外条件为例，深化上下文与记忆；保留来源、适用范围及回查路径，继续区分反馈与实际决策。不重讲已能应用的时效性与对象检查。\u003c/p>\n\u003ch2>2026-10-20：用户对信息路径的反馈\u003c/h2>\n\u003cp>用户能主动区分窗口容量与根本未读取，提出路径错误、未遵循规则、验收条件不足等可能原因，并关注与reference比对和外部工具验证。记为“本例能定位读取风险”，不泛化为掌握上下文管理。\u003c/p>\n\u003cp>需要深化：文件根本未读、工具读到但内容未送入/被截断摘要遗漏、模型得到内容却未正确使用，是三个不同环节。窗口大不自动读取文件；验收条件写清不保证执行。读取资料与核验答案相关但不是同一步，读过也可能推理错，不必每个任务都调用外部验证工具。偏差增加风险，不必然使所有输出不可控；可通过明确检查、缺资料时停下/澄清、保留来源及结果核验限制风险。README只是可能的入口，不是所有系统的必经文件。\u003c/p>\n\u003cp>后续用三种具体失败场景练习定位，避免重复基础词义。\u003c/p>\n\u003ch2>2026-10-20：信息路径再次复述\u003c/h2>\n\u003cp>用户已能独立组织排查链：模型调用工具→工具读取→模型使用，并概括“有没有资格读、有没有读、读后有没有用”。能列出路径、权限、执行、读取失败、读后加载上下文失败、模型疏漏或理解偏差。记录为“本例已能应用获取—传入—使用框架”，后续无需重讲基础词义。补充边界：工具调用通常由宿主程序执行，权限限制可能在不同环节发生；授权不代表执行；读取成功不代表完整传入；用过不代表正确使用。下一步以摘要丢失例外条件深化“完整传入”。\u003c/p>\n\u003ch2>2026-10-21：第四期\u003c/h2>\n\u003cp>承接用户独立复述，保留“本例已能应用获取—传入—使用框架”的判断，不重教基础术语。新增：摘要可能丢失对象与例外，读取成功不等于任务所需信息被保留；条件化摘要、来源定位、触发回读与缺证据时停止。以上仅已介绍，尚无用户回答，不标为掌握。\u003c/p>\n\u003cp>新报道：Octomind 0.58.5，官方文章2026-10-17。维护者描述会话规则单独保留机制；四轮重启演示未现场触发压缩，另称有测试覆盖；未独立复现。以后无实质变化不重复报道。\u003c/p>\n\u003cp>理解题：工具读到雨天北门，但摘要只有9点东门，应优先修哪一环，扩大窗口能否保证解决？\u003c/p>\n\u003cp>下一步：用变化条件的检查题发现摘要遗漏，区分自评、证据核验与行为验收；根据用户回答调整，不从未回复推断掌握。\u003c/p>\n\u003ch2>2026-10-21：多端阅读与发布偏好\u003c/h2>\n\u003cp>用户允许基础学习内容公开阅读，希望iOS、Windows均能访问。当前选择本机Codex生成后自动上传GitHub并发布学习台，不配置额外模型API Key；用户可保持电脑开机。每日任务继续在本聊天运行，反馈仍以聊天或明确记录为依据。已读标记不跨设备同步。此项是产品使用偏好，不代表新概念已掌握。\u003c/p>\n","updated":"2026年10月21日 08:06"};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='daily',selected=DATA.entries[0]?.date,tab='all',query='',filter='全部',step=0;
const storageKey='ai-learning-read-v1';let read=[];try{read=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(read))read=[]}catch{}
const tags=d=>d.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
const nav=()=>document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});
function setView(v){view=v;nav();render();window.scrollTo(0,0)}
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
document.getElementById('updated').textContent='最近整理 · '+DATA.updated;
function hero(k,t,d){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>`}
function render(){
 if(view==='daily')renderDaily();
 if(view==='archive')renderArchive();
 if(view==='concepts')app.innerHTML=hero('KNOWLEDGE NOTES','让概念慢慢连成网。','从日报提炼可复用的解释；回看时，不必重新翻完整篇文章。')+`<div class="concept-list">${DATA.concepts.map(c=>`<details class="card" open><summary>${esc(c.title)}</summary><div class="article">${c.html}</div><a class="button" href="${encodeURI(c.path)}">打开 Markdown 原文 ↗</a></details>`).join('')||'<div class="empty">概念笔记将随学习逐步积累。</div>'}</div>`;
 if(view==='progress')renderProgress();
 fixLinks();
}
function renderDaily(){const d=DATA.entries.find(d=>d.date===selected)||DATA.entries[0];if(!d){app.innerHTML=hero('DAILY','第一期正在路上。','生成日报后，这里会出现完整内容。');return}
 app.innerHTML=hero('DAILY / '+esc(d.date),'今天，理解一个新问题。','从新进展出发，沿着机制与证据，逐步建立自己的理解。')+`<div class="stats"><div class="stat"><strong>${DATA.entries.length.toString().padStart(2,'0')}</strong><span>已归档日报</span></div><div class="stat"><strong>${DATA.concepts.length.toString().padStart(2,'0')}</strong><span>概念笔记</span></div><div class="stat"><strong>15 min</strong><span>每日阅读预算</span></div></div><section class="card"><div class="daily-head"><div><div class="eyebrow">${d.date===DATA.entries[0].date?'最新一期':'历史回看'} · ${esc(d.date)}</div><h2>${esc(d.title.replace(/^AI 日报 \d+｜/,''))}</h2><div class="tags">${tags(d)}</div></div><span class="pill">◌ 从基础逐步深入</span></div><p style="color:var(--muted);font-size:14px">${esc(d.visual?.summary||'最新进展与系统学习，结合来源和可选理解题。')}</p><div class="actions"><a class="button primary" href="#reading">开始阅读 ↓</a><button class="button" id="read-toggle">${read.includes(d.date)?'✓ 已读 · 点击取消':'标记已读'}</button><a class="button" href="${encodeURI(d.path)}" download>下载 Markdown</a><button class="button" id="history">切换日期</button></div><div id="read-status" class="sr" role="status" aria-live="polite"></div></section>${d.visual?flowMarkup(d.visual):''}<section id="reading"><div class="tabs" role="tablist" aria-label="日报内容"><button role="tab" data-tab="all">完整日报</button><button role="tab" data-tab="news">最新进展</button><button role="tab" data-tab="lesson">系统学习</button><button role="tab" data-tab="question">理解题</button></div><div class="article card" id="article" role="tabpanel"></div></section>`;
 document.getElementById('history').onclick=()=>setView('archive');
 document.getElementById('read-toggle').onclick=()=>{read=read.includes(d.date)?read.filter(x=>x!==d.date):[...read,d.date];let saved=true;try{localStorage.setItem(storageKey,JSON.stringify(read))}catch{saved=false}render();document.getElementById('read-status').textContent=saved?'阅读标记已更新。':'浏览器不允许保存；此标记仅在当前页面有效。'};
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);updateFlow(d.visual)});

function flowMarkup(v){return `<section class="flow-panel" aria-label="互动流程图"><div class="eyebrow">LEARN VISUALLY / 互动图解</div><h3>${esc(v.title)}</h3><p>${esc(v.intro)}</p><div class="flow">${v.steps.map((s,i)=>`<button class="step" data-step="${i}" aria-controls="explanation"><span class="num">0${i+1}</span><b>${esc(s.label)}</b><small>${esc(s.role)}</small></button>`).join('')}</div>${v.feedback?`<div style="text-align:center;margin:-10px 0 18px"><button class="button" data-step="${v.feedback.to-1}" style="border-style:dashed;color:var(--green)">步骤 ${v.feedback.from} ↶ 步骤 ${v.feedback.to} · ${esc(v.feedback.label)}</button></div>`:''}<div class="explanation" id="explanation" aria-live="polite"></div><div class="flow-footer">${esc(v.footer)}</div></section>`}
function updateFlow(v){if(!v.steps.length)return;step=Math.min(step,v.steps.length-1);document.querySelectorAll('[data-step]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.step)===step);b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step))});const s=v.steps[step];document.getElementById('explanation').innerHTML=`<strong>${esc(s.label)} · ${esc(s.role)}</strong><p>${esc(s.detail)}</p><p class="failure">留意：${esc(s.failure)}</p>`}
function updateArticle(d){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-selected',String(b.dataset.tab===tab))});const container=document.getElementById('article');if(tab==='all'){container.innerHTML=d.html;return}const dom=new DOMParser().parseFromString(d.html,'text/html');const heads=[...dom.body.children];const pattern={news:/^一、|最新进展/,lesson:/^二、|系统学习/,question:/^三、|理解题/}[tab];let started=false,parts=[];for(const n of heads){if(n.tagName==='H2'){if(started)break;if(pattern.test(n.textContent))started=true}if(started)parts.push(n.outerHTML)}container.innerHTML=parts.join('')||'<p>本期未单独划分该栏目，请阅读完整日报。</p>'}
function renderArchive(){const allTags=[...new Set(DATA.entries.flatMap(d=>d.tags))];app.innerHTML=hero('ARCHIVE','把每天的发现，留成长期线索。','按日期回看，或按主题和关键词找到值得再读的内容。')+`<div class="toolbar"><label><span class="sr">搜索日报</span><input class="search" id="search" placeholder="搜索标题、正文或主题…" value="${esc(query)}"></label></div><div class="filters">${['全部',...allTags].map(t=>`<button data-filter="${esc(t)}" class="${filter===t?'active':''}" aria-pressed="${filter===t}">${esc(t)}</button>`).join('')}</div><div class="notice" id="result-count" role="status"></div><div class="archive-list" id="archive-list"></div>`;
 document.getElementById('search').oninput=e=>{query=e.target.value;renderResults()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderArchive()});renderResults()}
function renderResults(){const entries=DATA.entries.filter(d=>(filter==='全部'||d.tags.includes(filter))&&(d.title+' '+d.text).toLowerCase().includes(query.toLowerCase()));document.getElementById('result-count').textContent=`找到 ${entries.length} 期日报 · 日期从新到旧`;document.getElementById('archive-list').innerHTML=entries.map(d=>`<button class="archive-row" data-date="${d.date}"><time>${d.date}</time><h3>${esc(d.title)}</h3><p>${esc(d.visual?.summary||'点击阅读完整日报')}</p><div class="tags">${tags(d)}${read.includes(d.date)?'<span class="tag">已读</span>':''}</div></button>`).join('')||'<div class="empty">暂时没有匹配内容。试试其他关键词或主题。</div>';document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{selected=b.dataset.date;tab='all';step=0;setView('daily')})}
function renderProgress(){app.innerHTML=hero('LEARNING PATH','从看懂术语，到理解机制。','路线可以调整；阅读天数、阅读标记和已介绍概念，都不等于已经掌握。')+`<div class="roadmap">${DATA.roadmap.map(({title:t,description:d,status:s})=>`<div class="route"><div><strong>${esc(t)}</strong><p>${esc(d)}</p></div><small>${esc(s)}</small></div>`).join('')}</div><p class="notice">上方是起始路线。下面的学习记录是每日更新依据；具体进度以记录和你在聊天中的反馈为准。</p><details class="card" open><summary>学习记录与下一步</summary><div class="article">${DATA.progress}</div></details>`}
function fixLinks(){app.querySelectorAll('.article a').forEach(a=>{const raw=a.getAttribute('href')||'';if(/^https?:/i.test(raw)){a.target='_blank';a.rel='noopener noreferrer'}else if(/^(javascript|data|vbscript):/i.test(raw)){a.removeAttribute('href')}else if(!raw.startsWith('#')){const decoded=decodeURI(raw);const match=decoded.match(/(?:^|\/)日报\/(\d{4}-\d{2}-\d{2})\.md$/);if(match&&DATA.entries.some(d=>d.date===match[1])){a.onclick=e=>{e.preventDefault();selected=match[1];tab='all';setView('daily')}}else if(decoded.includes('概念/')){a.onclick=e=>{e.preventDefault();setView('concepts')}}else if(raw.startsWith('../')){a.setAttribute('href',raw.replace(/^\.\.\//,''))}}})}
render();
</script>
</body></html>
